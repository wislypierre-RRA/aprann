/* ---------------------------------------------------------
   FINISH LESSON
--------------------------------------------------------- */
/* --- FAIR PLAY (v3.1) -----------------------------------------------------------
   Each lesson can give 10 "finish" points + 2 per right quiz answer, once per kid.
   1) A lesson finished in less than MIN_SECS earns nothing that time (do it again, slowly).
   2) Only DAILY_NEW lessons per day can give the 10 finish points (come back tomorrow for more).
   3) Doing a lesson again with a better quiz score pays the difference.
   The Google Sheet applies the same rules; its count is the true one. */
const MIN_SECS = 60;
const DAILY_NEW = 5;
function lessonKey(tk, idx){ return tk + '#' + (idx+1); }
function paidRec(d, key, wasDone){
  d.paid = d.paid || {};
  if(!d.paid[key]) d.paid[key] = wasDone ? {b:1, q:99} : {b:0, q:0};   // finished before v3.1: counted as fully paid
  return d.paid[key];
}
function baseToday(d){ return ((d.baseDays||{})[ymd(new Date())]) || 0; }
function pointsLeft(tk, idx){
  const d = userData(); const rec = (d.paid||{})[lessonKey(tk, idx)]; if(!rec) return 0;
  const n = ((TRACKS[tk].lessons[idx]||{}).quiz||[]).length;
  return (rec.b ? 0 : 10) + Math.max(0, 2*n - rec.q);
}
function finishLesson(){
  const track = TRACKS[state.currentTrack];
  const idx = state.currentLessonIdx;
  const alreadyDone = state.completed[track.key].has(idx);
  const secs = state.lessonOpenedAt ? Math.max(0, Math.round((Date.now() - state.lessonOpenedAt)/1000)) : 9999;
  state.completed[track.key].add(idx);
  saveCurrentUserProgress();

  const resultDiv = document.getElementById('quiz-result');
  const total = track.lessons.length;
  const done = state.completed[track.key].size;
  const trackNowComplete = done>=total;
  const allNowComplete = isAllComplete();
  const correct = (typeof window._quizCorrect==='number') ? window._quizCorrect : 0;
  const quizLen = (track.lessons[idx].quiz||[]).length;

  const d = userData(); const rec = paidRec(d, lessonKey(track.key, idx), alreadyDone);
  const fast = secs < MIN_SECS;
  let earned = 0, capped = false;
  if(!fast){
    const gainQ = Math.max(0, 2*correct - rec.q); rec.q = Math.max(rec.q, 2*correct);
    let gainB = 0;
    if(!rec.b){
      if(baseToday(d) < DAILY_NEW){
        gainB = 10; rec.b = 1;
        const td = ymd(new Date()); d.baseDays = d.baseDays || {}; d.baseDays[td] = (d.baseDays[td]||0) + 1;
      } else capped = true;
    }
    earned = awardPoints(gainB + gainQ);   // also gives the +2 for the first lesson of the day
  }
  const left = (rec.b ? 0 : 10) + Math.max(0, 2*quizLen - rec.q);
  if(!alreadyDone && !fast){
    celebrate(trackNowComplete ? 'track' : 'lesson');
    playMsg(trackNowComplete ? 'm4' : 'm2');
  }
  saveCurrentUserProgress();
  queueEvent(alreadyDone ? 'lesson_repeat' : 'lesson_done', {
    track: track.key, lesson: idx+1, lessonTitle: track.lessons[idx].title,
    score: (typeof window._quizCorrect==='number') ? window._quizCorrect : '',
    quizTotal: (typeof window._quizTotal==='number') ? window._quizTotal : '',
    trackDone: (!alreadyDone && trackNowComplete) ? 'yes' : '', allDone: (!alreadyDone && allNowComplete) ? 'yes' : '',
    secs: secs, pts: earned, week: thisWeek(), weekPts: ((userData().weeks||{})[thisWeek()]||{}).pts||0
  });

  if(resultDiv){
    let h = '<div class="score-banner">✅ '+t('lessonDoneMsg')+'</div>';
    if(!alreadyDone && trackNowComplete){
      h += '<div class="celebrate-banner"><p><strong>'+t('celebrateTrackTitle')+'</strong></p><p>'+t('celebrateTrackMsg')+'</p>';
      if(allNowComplete){
        h += '<p>'+t('celebrateAllMsg')+'</p><div class="row"><button class="btn gold" onclick="openCertificate(\'all\')">'+t('viewCertNowBtn')+'</button></div>';
      } else {
        h += '<div class="row"><button class="btn gold" onclick="openCertificate(\''+track.key+'\')">'+t('viewCertNowBtn')+'</button></div>';
      }
      h += '</div>';
    }
    if(earned>0) h += '<div class="score-banner" style="margin-top:8px;">'+t('ptsEarned').replace('{n}',earned)+'</div>';
    if(fast) h += '<div class="score-banner warn" style="margin-top:8px;">'+t('tooFast')+'</div>';
    else if(capped) h += '<div class="score-banner warn" style="margin-top:8px;">'+t('capMsg').replace('{n}',DAILY_NEW)+'</div>';
    else if(left>0) h += '<div class="score-banner warn" style="margin-top:8px;">'+t('improveMsg').replace('{n}',left)+'</div>';
    if(left>0) h += '<div class="row"><button class="btn secondary" type="button" onclick="openLesson('+idx+')">'+t('redoBtn')+'</button></div>';
    resultDiv.innerHTML = h;
  }

  checkBadges(true);
  const btn = document.getElementById('finish-btn');
  if(btn){
    btn.textContent = t('finishBtnDone');
    btn.disabled = true;
  }

  if(idx < total-1){
    const nextBtn = document.createElement('button');
    nextBtn.className='btn';
    nextBtn.style.marginTop='10px';
    nextBtn.textContent=t('nextLessonBtn');
    nextBtn.onclick = ()=>openLesson(idx+1);
    document.getElementById('lesson-content').appendChild(nextBtn);
  }
}

/* ---------------------------------------------------------
   CERTIFICATE
--------------------------------------------------------- */
function renderCertificate(scope){
  const wrap = document.getElementById('cert-wrap');
  const name = state.currentUser ? escapeHtml(splitKey(state.currentUser).name) : '';
  const date = formatToday();
  let courseLine, titleText;
  if(scope==='all'){
    titleText = t('certTitleAll');
    courseLine = t('certLineCompletedAll');
  } else {
    const track = TRACKS[scope];
    titleText = t('certTitleTrack');
    courseLine = t('certLineCompletedTrack') + ' <span class="cert-course">' + track.emoji + ' ' + L(track,'label') + '</span>';
  }
  wrap.innerHTML = `
    <div class="cert-seal">🏅</div>
    <p class="cert-kicker">${t('certKicker')}</p>
    <h2 class="cert-title">${titleText}</h2>
    <p class="cert-line">${t('certLineThisCertifies')}</p>
    <div class="cert-name">${name || '—'}</div>
    <p class="cert-line">${courseLine}</p>
    <p class="cert-org">🇭🇹 ${t('certOrg')}</p>
    <p class="cert-date">${t('certDatePrefix')}: ${date}</p>
  `;
}

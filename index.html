<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprann Ak Nou!</title>
<meta name="theme-color" content="#00209F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aprann">
<style>
  :root{
    --blue:#00209F;
    --red:#D21034;
    --green:#1a7a3c;
    --gold:#f4b400;
    --ink:#1c2130;
    --paper:#fffdf8;
    --card:#ffffff;
    --muted:#6b7280;
    --ring:#e6e2d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:0;
    background:linear-gradient(180deg,#f7f5ef 0%,#fffdf8 400px);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:20px 16px 64px;
  }
  header.top{
    display:flex;
    align-items:center;
    gap:12px;
    padding:18px 0 8px;
    flex-wrap:wrap;
  }
  header.top .badge{
    width:48px;height:48px;border-radius:14px;
    background:linear-gradient(135deg,var(--blue),var(--red));
    display:flex;align-items:center;justify-content:center;
    font-size:24px;flex-shrink:0;
  }
  header.top h1{
    font-size:1.35rem;
    margin:0;
  }
  header.top p.sub{
    margin:2px 0 0;
    color:var(--muted);
    font-size:0.9rem;
  }
  .header-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .user-badge{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:999px;
    padding:6px 8px 6px 14px;
    font-size:0.9rem;
    font-weight:600;
  }
  .lang-toggle{
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:999px;
    padding:8px 14px;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .lang-toggle:hover{border-color:var(--blue);}
  .btn.secondary.small{
    padding:6px 12px;
    font-size:0.8rem;
    border-radius:999px;
  }
  .name-chip{
    background:#fff;
    border:1px solid var(--ring);
    border-radius:999px;
    padding:8px 14px;
    cursor:pointer;
    font-size:0.9rem;
  }
  .name-chip:hover{border-color:var(--blue);}
  .progress-table{
    width:100%;
    border-collapse:collapse;
    margin-top:14px;
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:14px;
    overflow:hidden;
  }
  .progress-table th, .progress-table td{
    padding:10px 12px;
    text-align:left;
    border-bottom:1px solid var(--ring);
    font-size:0.92rem;
  }
  .progress-table th{background:#faf9f5;}
  .empty-note{color:var(--muted);font-size:0.92rem;margin-top:14px;}
  .screen{display:none;}
  .screen.active{display:block;}
  .intro-card{
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:18px;
    padding:18px 20px;
    margin:18px 0 24px;
  }
  .intro-card p{margin:0 0 8px;}
  .intro-card p:last-child{margin-bottom:0;}
  .tracks{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:16px;
  }
  .track-card{
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:18px;
    padding:20px;
    cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .track-card:hover, .track-card:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
  }
  .track-card .emoji{font-size:2.2rem;}
  .track-card h3{margin:0;font-size:1.15rem;}
  .track-card p{margin:0;color:var(--muted);font-size:0.9rem;}
  .track-card .cert-pill{
    display:inline-block;
    background:#fff8e6;
    border:1px solid var(--gold);
    color:#8a6300;
    border-radius:999px;
    padding:3px 10px;
    font-size:0.78rem;
    font-weight:700;
    width:fit-content;
  }
  .progress-bar{
    height:10px;
    border-radius:6px;
    background:#eee;
    overflow:hidden;
  }
  .progress-bar > div{
    height:100%;
    border-radius:6px;
    background:var(--track-color,var(--blue));
    transition:width .3s ease;
  }
  .progress-label{font-size:0.8rem;color:var(--muted);}
  button{
    font-family:inherit;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:12px 18px;
    font-size:1rem;
    cursor:pointer;
    font-weight:600;
  }
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--ring);
  }
  .btn.gold{
    background:linear-gradient(135deg,var(--gold),#e08e00);
    color:#3a2900;
  }
  .btn.back{
    background:transparent;
    color:var(--blue);
    padding:8px 4px;
    font-weight:600;
  }
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .lesson-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:16px;
  }
  .lesson-item{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:14px;
    padding:14px 16px;
    cursor:pointer;
    text-align:left;
  }
  .lesson-item:hover{background:#faf9f5;}
  .lesson-item .num{
    width:34px;height:34px;border-radius:50%;
    background:var(--ring);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;flex-shrink:0;
    font-size:0.95rem;
  }
  .lesson-item.done .num{background:var(--green);color:#fff;}
  .lesson-item .title{font-weight:600;}
  .lesson-item .check{margin-left:auto;font-size:1.2rem;color:var(--green);}
  .track-title-row{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    margin-top:6px;
  }
  .track-title-row .emoji{font-size:1.8rem;}
  .lesson-content{
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:18px;
    padding:22px;
    margin-top:16px;
  }
  .lesson-content h2{margin-top:0;}
  .section{margin:18px 0;}
  .section h4{margin:0 0 6px;color:var(--blue);}
  .vocab-table{
    width:100%;
    border-collapse:collapse;
    margin:10px 0;
  }
  .vocab-table td, .vocab-table th{
    border-bottom:1px solid var(--ring);
    padding:8px 6px;
    text-align:left;
    font-size:0.95rem;
  }
  code.block{
    display:block;
    background:#1c2130;
    color:#e9f1ff;
    padding:14px 16px;
    border-radius:10px;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    white-space:pre;
    overflow-x:auto;
    margin:10px 0;
    font-size:0.92rem;
  }
  .tip{
    background:#fff8e6;
    border:1px solid #f0dca0;
    border-radius:12px;
    padding:10px 14px;
    font-size:0.92rem;
    margin:10px 0;
  }
  .activity{
    margin-top:22px;
    border-top:2px dashed var(--ring);
    padding-top:18px;
  }
  .activity h3{margin-top:0;}
  .q-block{
    background:#faf9f5;
    border:1px solid var(--ring);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .q-block p.q-text{font-weight:600;margin:0 0 10px;}
  .q-options{display:flex;flex-direction:column;gap:8px;}
  .q-opt{
    text-align:left;
    background:#fff;
    border:1px solid var(--ring);
    border-radius:10px;
    padding:10px 12px;
    cursor:pointer;
    font-size:0.95rem;
  }
  .q-opt:hover{border-color:var(--blue);}
  .q-opt.correct{background:#e6f6ec;border-color:var(--green);}
  .q-opt.wrong{background:#fdeaea;border-color:var(--red);}
  .q-opt[disabled]{cursor:default;}
  .q-feedback{margin-top:8px;font-size:0.9rem;color:var(--muted);}
  .click-area{
    position:relative;
    height:220px;
    background:#f3f6ff;
    border:2px dashed #c9d4f5;
    border-radius:14px;
    margin:14px 0;
    overflow:hidden;
  }
  .click-target{
    position:absolute;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--red);
    color:#fff;
    border:none;
    font-size:1.4rem;
    cursor:pointer;
  }
  .type-practice input{
    width:100%;
    font-size:1.1rem;
    padding:10px 12px;
    border:1px solid var(--ring);
    border-radius:10px;
    font-family:monospace;
  }
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;}
  .score-banner{
    background:#e6f6ec;
    border:1px solid var(--green);
    border-radius:14px;
    padding:14px 16px;
    margin-top:14px;
    font-weight:600;
  }
  .celebrate-banner{
    background:linear-gradient(135deg,#fff8e6,#ffe9c7);
    border:1px solid var(--gold);
    border-radius:14px;
    padding:16px 18px;
    margin-top:14px;
    font-weight:600;
  }
  .celebrate-banner p{margin:0 0 10px;}
  .celebrate-banner p:last-child{margin-bottom:0;}
  footer.note{
    margin-top:40px;
    padding-top:16px;
    border-top:1px solid var(--ring);
    color:var(--muted);
    font-size:0.85rem;
  }
  details.trainer{
    margin-top:20px;
    background:#f3f6ff;
    border:1px solid #c9d4f5;
    border-radius:14px;
    padding:12px 16px;
  }
  details.trainer summary{cursor:pointer;font-weight:600;color:var(--blue);}
  details.trainer ul{margin:10px 0 0;padding-left:20px;}

  /* ---------- Confetti / balloon celebration ---------- */
  #celebrate-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:999;
  }
  .confetti-piece{
    position:absolute;
    top:-20px;
    width:10px;height:16px;
    opacity:0.95;
    animation-name:confetti-fall;
    animation-timing-function:ease-in;
    animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(540deg); opacity:0.3; }
  }
  .balloon-piece{
    position:absolute;
    bottom:-60px;
    font-size:2.2rem;
    animation-name:balloon-rise;
    animation-timing-function:ease-out;
    animation-fill-mode:forwards;
  }
  @keyframes balloon-rise{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(-115vh) rotate(12deg); opacity:0; }
  }

  /* ---------- Certificate ---------- */
  .cert-wrap{
    background:var(--card);
    border:3px solid var(--gold);
    border-radius:20px;
    padding:36px 28px;
    margin-top:16px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .cert-wrap::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;height:10px;
    background:repeating-linear-gradient(90deg,var(--blue) 0 20px,var(--red) 20px 40px);
  }
  .cert-seal{font-size:2.6rem;margin-bottom:6px;}
  .cert-kicker{
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--muted);
    font-size:0.8rem;
    font-weight:700;
    margin:0 0 6px;
  }
  .cert-title{
    font-size:1.7rem;
    margin:0 0 18px;
    color:var(--blue);
  }
  .cert-line{margin:6px 0;font-size:1rem;}
  .cert-name{
    font-size:1.8rem;
    font-weight:800;
    margin:10px 0;
    color:var(--ink);
    border-bottom:2px solid var(--ring);
    display:inline-block;
    padding:0 10px 6px;
  }
  .cert-course{font-size:1.15rem;font-weight:700;color:var(--green);margin:8px 0 4px;}
  .cert-org{margin-top:22px;font-weight:700;color:var(--blue);}
  .cert-date{color:var(--muted);font-size:0.9rem;margin-top:4px;}
  @media print{
    body *{visibility:hidden;}
    #cert-print-area, #cert-print-area *{visibility:visible;}
    #cert-print-area{position:absolute;top:0;left:0;width:100%;}
    .no-print{display:none !important;}
  }

  @media (max-width:480px){
    header.top h1{font-size:1.15rem;}
    .lesson-content{padding:16px;}
    .cert-wrap{padding:24px 16px;}
    .cert-name{font-size:1.4rem;}
  }
</style>
</head>
<body>
<div id="celebrate-layer"></div>
<div class="wrap">

  <header class="top">
    <div class="badge">🇭🇹</div>
    <div>
      <h1>Aprann Ak Nou!</h1>
      <p class="sub" id="header-sub"></p>
    </div>
    <div class="header-actions">
      <button class="lang-toggle" id="lang-toggle-btn" onclick="toggleLang()"></button>
      <div id="user-badge" class="user-badge" style="display:none;">
        <span id="user-badge-name"></span>
        <button class="btn secondary small" id="change-name-btn" onclick="changeUser()"></button>
      </div>
    </div>
  </header>

  <!-- NAME / PROFILE SCREEN -->
  <section id="screen-name" class="screen active">
    <div class="intro-card">
      <p id="name-prompt"></p>
      <div class="row">
        <input type="text" id="name-input" style="flex:1;min-width:200px;font-size:1.05rem;padding:12px 14px;border:1px solid var(--ring);border-radius:10px;">
        <button class="btn" id="start-btn" onclick="startWithName()"></button>
      </div>
      <p id="name-list-wrap" style="display:none;margin-top:14px;">
        <span class="progress-label" id="or-choose-name"></span><br>
        <span id="name-list" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;"></span>
      </p>
    </div>
    <details class="trainer">
      <summary id="trainer-summary"></summary>
      <ul id="trainer-list"></ul>
    </details>
  </section>

  <!-- HOME SCREEN -->
  <section id="screen-home" class="screen">
    <div class="intro-card">
      <p id="home-intro-1"></p>
      <p id="home-intro-2"></p>
    </div>

    <div class="tracks" id="track-cards"></div>

    <div id="overall-cert-row" class="row" style="margin-top:18px;display:none;">
      <button class="btn gold" onclick="openCertificate('all')">🏆 <span id="view-overall-cert-label"></span></button>
    </div>

    <div class="row" style="margin-top:18px;">
      <button class="btn secondary" id="progress-all-btn" onclick="openProgressView()"></button>
    </div>
  </section>

  <!-- PROGRESS OVERVIEW SCREEN (for trainers) -->
  <section id="screen-progress" class="screen">
    <button class="btn back" onclick="goHome()" id="back-btn-1"></button>
    <h2 id="progress-title"></h2>
    <p class="progress-label" id="progress-sub"></p>
    <div id="progress-table-wrap"></div>
    <div class="row" style="margin-top:18px;">
      <button class="btn secondary" id="clear-data-btn" onclick="clearAllData()"></button>
    </div>
  </section>

  <!-- TRACK LIST SCREEN -->
  <section id="screen-track" class="screen">
    <button class="btn back" onclick="goHome()" id="back-btn-2"></button>
    <div class="track-title-row">
      <span class="emoji" id="track-emoji"></span>
      <h2 id="track-title" style="margin:0;"></h2>
    </div>
    <p class="progress-label" id="track-progress-label"></p>
    <div class="progress-bar"><div id="track-progress-fill" style="width:0%"></div></div>
    <div id="track-cert-row" class="row" style="display:none;">
      <button class="btn gold" id="track-cert-btn">🏆</button>
    </div>
    <div class="lesson-list" id="lesson-list"></div>
  </section>

  <!-- LESSON SCREEN -->
  <section id="screen-lesson" class="screen">
    <button class="btn back" onclick="goToTrack()" id="back-btn-3"></button>
    <div class="lesson-content" id="lesson-content"></div>
  </section>

  <!-- CERTIFICATE SCREEN -->
  <section id="screen-cert" class="screen">
    <button class="btn back no-print" onclick="goHome()" id="back-btn-4"></button>
    <div id="cert-print-area">
      <div class="cert-wrap" id="cert-wrap"></div>
    </div>
    <div class="row no-print" style="margin-top:16px;">
      <button class="btn" onclick="window.print()" id="print-cert-btn"></button>
    </div>
  </section>

  <footer class="note" id="footer-note"></footer>
</div>

<script>
/* ---------------------------------------------------------
   DATA: TRACKS, LESSONS, ACTIVITIES
   Every text field that can appear in English has a matching
   "<field>_en" sibling. When one is missing, English mode
   falls back to the base (Kreyòl) value — used on purpose for
   the English-track vocabulary itself, which is bilingual by
   nature and doesn't need a separate translation.
--------------------------------------------------------- */
const TRACKS = {

  konpite: {
    key:'konpite', label:'Konpitè Debaz', label_en:'Basic Computers', emoji:'💻', color:'var(--blue)',
    lessons:[
      {
        title:'Ki sa yon Òdinatè ye?', title_en:'What is a Computer?',
        sections:[
          {h:'Entwodiksyon', h_en:'Introduction', body:`
            <p>Yon <strong>òdinatè</strong> se yon machin ki ka ede nou aprann, ekri, jwe, ak kominike ak lòt moun. Gen kèk pati enpòtan nan yon òdinatè ke nou dwe konnen:</p>
            <table class="vocab-table">
              <tr><th>Pati a</th><th>Sa li fè</th></tr>
              <tr><td><strong>Ekran</strong> (Screen)</td><td>Kote nou wè tout bagay — tèks, imaj, videyo</td></tr>
              <tr><td><strong>Klavye</strong> (Keyboard)</td><td>Zouti ak lèt ak nimewo pou nou ekri</td></tr>
              <tr><td><strong>Sourit</strong> (Mouse)</td><td>Zouti pou pwente ak klike sou bagay sou ekran an</td></tr>
              <tr><td><strong>Inite Santral</strong> (CPU/Tower)</td><td>"Sèvo" òdinatè a — kote tout enfòmasyon trete</td></tr>
            </table>
            <div class="tip">💡 Astis: Panse ak yon òdinatè tankou yon moun — ekran an se je l, klavye ak sourit se men l, epi inite santral la se sèvo l.</div>
          `, body_en:`
            <p>A <strong>computer</strong> is a machine that can help us learn, write, play, and communicate with other people. There are a few important parts of a computer we should know:</p>
            <table class="vocab-table">
              <tr><th>Part</th><th>What it does</th></tr>
              <tr><td><strong>Screen</strong></td><td>Where we see everything — text, images, video</td></tr>
              <tr><td><strong>Keyboard</strong></td><td>Tool with letters and numbers for typing</td></tr>
              <tr><td><strong>Mouse</strong></td><td>Tool to point and click on things on the screen</td></tr>
              <tr><td><strong>Central Unit</strong> (CPU/Tower)</td><td>The computer's "brain" — where all information is processed</td></tr>
            </table>
            <div class="tip">💡 Tip: Think of a computer like a person — the screen is its eyes, the keyboard and mouse are its hands, and the central unit is its brain.</div>
          `}
        ],
        quiz:[
          {q:'Ki pati òdinatè a nou itilize pou ekri lèt ak nimewo?', q_en:'Which computer part do we use to type letters and numbers?', opts:['Ekran','Klavye','Sourit','Inite Santral'], opts_en:['Screen','Keyboard','Mouse','Central Unit'], correct:1, exp:'Klavye a gen tout lèt ak nimewo yo pou nou ekri.', exp_en:'The keyboard has all the letters and numbers for typing.'},
          {q:"Ki pati a yo rele 'sèvo' òdinatè a?", q_en:"Which part is called the computer's 'brain'?", opts:['Ekran','Sourit','Inite Santral','Klavye'], opts_en:['Screen','Mouse','Central Unit','Keyboard'], correct:2, exp:'Inite santral la trete tout enfòmasyon, tankou sèvo nou.', exp_en:'The central unit processes all information, like our brain.'},
          {q:'Kisa nou itilize pou klike sou yon bagay sou ekran an?', q_en:'What do we use to click on something on the screen?', opts:['Klavye','Sourit','Ekran','Kab'], opts_en:['Keyboard','Mouse','Screen','Cable'], correct:1, exp:'Sourit la se zouti pou pwente ak klike.', exp_en:'The mouse is the tool to point and click.'}
        ]
      },
      {
        title:'Aprann Itilize Sourit la', title_en:'Learning to Use the Mouse',
        sections:[
          {h:'Twa mouvman debaz', h_en:'Three basic movements', body:`
            <p>Gen twa bagay prensipal ou ka fè ak yon sourit:</p>
            <table class="vocab-table">
              <tr><td><strong>Klike</strong> (Click)</td><td>Peze bouton goch la yon sèl fwa</td></tr>
              <tr><td><strong>Doub-klike</strong> (Double-click)</td><td>Peze bouton goch la de fwa vit vit</td></tr>
              <tr><td><strong>Trennen</strong> (Drag)</td><td>Peze bouton an epi deplase sourit la san lage l</td></tr>
            </table>
            <div class="tip">💡 Pratike se pi bon fason pou aprann. Eseye jwèt anba a: klike sou wonn wouj la 5 fwa pou w pratike.</div>
          `, body_en:`
            <p>There are three main things you can do with a mouse:</p>
            <table class="vocab-table">

              <tr><td><strong>Double-click</strong></td><td>Press the left button twice quickly</td></tr>
              <tr><td><strong>Drag</strong></td><td>Press the button and move the mouse without releasing it</td></tr>
            </table>
            <div class="tip">💡 Practice is the best way to learn. Try the game below: click the red circle 5 times to practice.</div>
          `}

        activity:{type:'click', goal:5, label:'Klike sou wonn nan', label_en:'Click on the circle'},
        quiz:[

          {q:'Kisa "trennen" (drag) vle di?', q_en:"What does 'drag' mean?", opts:['Peze yon sèl fwa','Deplase sourit san lage bouton an','Retire sourit la','Fèmen aplikasyon an'], opts_en:['Press once','Move the mouse without releasing the button','Remove the mouse','Close the application'], correct:1, exp:'Trennen se lè w kenbe bouton an epi deplase sourit la.', exp_en:'Drag is when you hold the button and move the mouse.'}

      {
        title:'Aprann Itilize Klavye a', title_en:'Learning to Use the Keyboard',
        sections:[
          {h:'Konnen klavye a', h_en:'Getting to know the keyboard', body:`
            <p>Klavye a gen anpil ti bouton (kle) sou li. Men kèk ki enpòtan:</p>
            <table class="vocab-table">
              <tr><td><strong>Espas</strong> (Space bar)</td><td>Bouton long anba a — li fè yon espas ant mo</td></tr>
              <tr><td><strong>Antre</strong> (Enter)</td><td>Li fè yon nouvo liy oswa konfime yon bagay</td></tr>
              <tr><td><strong>Shift</strong></td><td>Kenbe l pou ekri yon lèt an majiskil</td></tr>
              <tr><td><strong>Efase</strong> (Backspace)</td><td>Retire dènye lèt ou ekri a</td></tr>
            </table>
            <p>Eseye tape fraz sa a nan bwat anba a pou w pratike:</p>
          `, body_en:`
            <p>The keyboard has lots of little buttons (keys) on it. Here are a few important ones:</p>
            <table class="vocab-table">
              <tr><td><strong>Space bar</strong></td><td>The long button at the bottom — it makes a space between words</td></tr>
              <tr><td><strong>Enter</strong></td><td>Makes a new line or confirms something</td></tr>
              <tr><td><strong>Shift</strong></td><td>Hold it to type a capital letter</td></tr>
              <tr><td><strong>Backspace</strong></td><td>Removes the last letter you typed</td></tr>
            </table>
            <p>Try typing this sentence in the box below to practice:</p>
          `}
        ],
        activity:{type:'typing', target:'Mwen renmen aprann', target_en:'I love learning', label:'Tape fraz la egzakteman jan li ekri a', label_en:"Type the sentence exactly as it's written"},
        quiz:[
          {q:'Ki bouton nou itilize pou fè yon espas ant de mo?', q_en:'Which button do we use to make a space between two words?', opts:['Enter','Espas','Shift','Backspace'], opts_en:['Enter','Space','Shift','Backspace'], correct:1, exp:'Bouton Espas la fè yon vid ant de mo.', exp_en:'The Space button makes a gap between two words.'},
          {q:'Ki bouton nou peze pou retire yon lèt nou fenk ekri?', q_en:'Which button do we press to remove a letter we just typed?', opts:['Espas','Enter','Backspace','Shift'], opts_en:['Space','Enter','Backspace','Shift'], correct:2, exp:'Backspace efase dènye lèt la.', exp_en:'Backspace erases the last letter.'}
        ]
      },
      {
        title:'Dosye ak Fichye', title_en:'Files and Folders',
        sections:[
          {h:'Konprann òganizasyon', h_en:'Understanding organization', body:`
            <p>Yon <strong>fichye</strong> (file) se tankou yon dokiman — pa egzanp, yon foto, yon istwa ou ekri, oswa yon desen.</p>
            <p>Yon <strong>dosye</strong> (folder) se tankou yon bwat oswa yon klasè kote nou mete plizyè fichye ansanm pou nou ka jwenn yo fasil pita.</p>
            <div class="tip">💡 Egzanp: Si w gen 10 foto ou pran nan yon fèt, ou ka mete yo tout nan yon dosye ki rele "Fèt" pou w pa pèdi yo.</div>
          `, body_en:`
            <p>A <strong>file</strong> is like a document — for example, a photo, a story you wrote, or a drawing.</p>
            <p>A <strong>folder</strong> is like a box or binder where we put several files together so we can find them easily later.</p>
            <div class="tip">💡 Example: If you have 10 photos from a party, you can put them all in a folder called "Party" so you don't lose them.</div>
          `}
        ],
        quiz:[
          {q:'Kisa yon "fichye" ye?', q_en:"What is a 'file'?", opts:['Yon bwat pou mete dokiman','Yon dokiman tankou yon foto oswa yon istwa','Yon kalite sourit','Yon kouran elektrik'], opts_en:['A box to put documents in','A document like a photo or a story','A type of mouse','An electric current'], correct:1, exp:'Fichye a se dokiman an menm.', exp_en:'The file is the document itself.'},
          {q:'Poukisa nou itilize dosye (folder)?', q_en:'Why do we use folders?', opts:['Pou fè òdinatè a mache pi vit','Pou òganize fichye yo ansanm pou n jwenn yo fasil','Pou chanje koulè ekran an','Pou konekte ak entènèt'], opts_en:['To make the computer run faster','To organize files together so we can find them easily','To change the screen color','To connect to the internet'], correct:1, exp:'Dosye yo ede nou rete òganize.', exp_en:'Folders help us stay organized.'}
        ]
      },
      {
        title:'Sekirite sou Entènèt', title_en:'Internet Safety',
        sections:[
          {h:'Kèk règ enpòtan', h_en:'Some important rules', body:`
            <p>Entènèt la se yon zouti ki itil anpil, men fòk nou toujou pridan:</p>
            <ul>
              <li>🔒 <strong>Pa janm bay modpas ou</strong> a lòt moun, menm zanmi.</li>
              <li>🖱️ <strong>Pa klike</strong> sou lyen oswa mesaj ou pa konnen.</li>
              <li>🙋 <strong>Mande yon granmoun ede w</strong> si yon bagay fè w pè oswa ki sanble dwòl.</li>
              <li>🤐 <strong>Pa pataje enfòmasyon prive</strong> (non lekòl ou, adrès ou) ak moun ou pa konnen.</li>
            </ul>
          `, body_en:`
            <p>The internet is a very useful tool, but we always have to be careful:</p>
            <ul>
              <li>🔒 <strong>Never give your password</strong> to anyone, even friends.</li>
              <li>🖱️ <strong>Don't click</strong> on links or messages you don't recognize.</li>
              <li>🙋 <strong>Ask an adult for help</strong> if something scares you or seems strange.</li>
              <li>🤐 <strong>Don't share private information</strong> (your school's name, your address) with people you don't know.</li>
            </ul>
          `}
        ],
        quiz:[
          {q:'Si yon mesaj dwòl mande w modpas ou, kisa ou dwe fè?', q_en:'If a strange message asks for your password, what should you do?', opts:['Bay li imedyatman','Pa reponn epi di yon granmoun','Ekri yon lòt modpas fo','Ignore l epi kontinye klike sou lyen an'], opts_en:['Give it right away',"Don't answer and tell an adult",'Write a fake password','Ignore it and keep clicking the link'], correct:1, exp:'Toujou di yon granmoun konfyans lè yon bagay sanble dwòl.', exp_en:'Always tell a trusted adult when something seems strange.'},
          {q:'Èske li san danje pou pataje adrès lakay ou ak yon enkoni sou entènèt?', q_en:'Is it safe to share your home address with a stranger online?', opts:['Wi, toujou','Non, sa pa an sekirite','Sèlman si yo mande souple','Wi si se yon jwèt'], opts_en:['Yes, always',"No, that's not safe",'Only if they ask nicely',"Yes if it's a game"], correct:1, exp:'Pa janm pataje enfòmasyon prive ak moun ou pa konnen.', exp_en:"Never share private information with people you don't know."}
        ]
      },
      {
        title:'Revizyon Final — Konpitè', title_en:'Final Review — Computers',
        sections:[
          {h:'Ann repase!', h_en:"Let's review!", body:`<p>Ou fin aprann anpil bagay sou konpitè debaz. Ann fè yon ti revizyon pou wè sa ou sonje.</p>`, body_en:`<p>You've learned a lot about basic computers. Let's do a quick review to see what you remember.</p>`}
        ],
        quiz:[
          {q:'Ki pati òdinatè a nou pwente ak li pou klike?', q_en:'Which computer part do we point with to click?', opts:['Klavye','Sourit','Ekran','Tou'], opts_en:['Keyboard','Mouse','Screen','Both'], correct:1, exp:'Se sourit la nou itilize pou pwente ak klike.', exp_en:"It's the mouse we use to point and click."},
          {q:'Kisa yon dosye (folder) itil pou fè?', q_en:'What is a folder useful for?', opts:['Òganize fichye yo','Louvri entènèt la','Chanje modpas la','Fè òdinatè a limen'], opts_en:['Organizing files','Opening the internet','Changing the password','Turning the computer on'], correct:0, exp:'Dosye yo ede nou òganize fichye.', exp_en:'Folders help us organize files.'},
          {q:'Ki bouton ki fè yon espas ant de mo lè n ap tape?', q_en:'Which button makes a space between two words when typing?', opts:['Enter','Shift','Espas','Backspace'], opts_en:['Enter','Shift','Space','Backspace'], correct:2, exp:'Espas la separe mo yo.', exp_en:'Space separates words.'},
          {q:'Si yon lyen sanble dwòl sou entènèt, ki sa ki pi bon bagay pou fè?', q_en:"If a link looks strange online, what's the best thing to do?", opts:['Klike sou li pou wè','Pa klike, mande yon granmoun','Pataje l ak zanmi','Ekri modpas ou'], opts_en:['Click it to see', "Don't click, ask an adult",'Share it with friends','Type your password'], correct:1, exp:'Toujou pridan ak lyen dwòl — mande èd.', exp_en:'Always be careful with strange links — ask for help.'}
        ]
      },
      {
        title:'Navige sou Entènèt', title_en:'Browsing the Internet',
        sections:[
          {h:'Jwenn enfòmasyon sou entènèt', h_en:'Finding information on the internet', body:`
            <p>Yon <strong>navigatè web</strong> (browser) se pwogram nou itilize pou vizite sit entènèt yo — tankou Chrome, Safari, oswa Firefox. Chak sit gen yon <strong>adrès</strong> (URL) — tankou yon adrès lakay pou sit la.</p>
            <table class="vocab-table">
              <tr><td><strong>Navigatè web</strong> (Browser)</td><td>Pwogram pou vizite sit entènèt</td></tr>
              <tr><td><strong>Motè rechèch</strong> (Search engine)</td><td>Sit tankou Google ki ede nou jwenn enfòmasyon</td></tr>
              <tr><td><strong>Onglè</strong> (Tab)</td><td>Yon fenèt ki louvri anndan navigatè a, ou ka gen plizyè an menm tan</td></tr>
              <tr><td><strong>Favori</strong> (Bookmark)</td><td>Yon fason pou sove yon sit ou vle vizite ankò</td></tr>
            </table>
            <div class="tip">💡 Lè w ap chèche yon bagay sou Google, itilize mo kle senp — pa ekri yon fraz antye. Egzanp: "meteyo Ayiti" pi bon pase "ki tan li ap fè an Ayiti jodi a".</div>
          `, body_en:`
            <p>A <strong>web browser</strong> is the program we use to visit websites — like Chrome, Safari, or Firefox. Every site has an <strong>address</strong> (URL) — like a home address for the site.</p>
            <table class="vocab-table">
              <tr><td><strong>Web browser</strong></td><td>Program for visiting websites</td></tr>
              <tr><td><strong>Search engine</strong></td><td>A site like Google that helps us find information</td></tr>
              <tr><td><strong>Tab</strong></td><td>A window open inside the browser — you can have several at once</td></tr>
              <tr><td><strong>Bookmark</strong></td><td>A way to save a site you want to visit again</td></tr>
            </table>
            <div class="tip">💡 When searching for something on Google, use simple keywords — don't write a whole sentence. Example: "Haiti weather" works better than "what will the weather be like in Haiti today".</div>
          `}
        ],
        quiz:[
          {q:'Kisa yon navigatè web (browser) itil pou fè?', q_en:'What is a web browser used for?', opts:['Pou ekri dokiman','Pou vizite sit entènèt','Pou pran foto','Pou jwe mizik'], opts_en:['Writing documents','Visiting websites','Taking photos','Playing music'], correct:1, exp:'Navigatè a se pwogram ki ouvri sit entènèt yo.', exp_en:'The browser is the program that opens websites.'},
          {q:"Kisa yon 'motè rechèch' (search engine) tankou Google fè?", q_en:"What does a 'search engine' like Google do?", opts:['Li efase fichye','Li ede nou jwenn enfòmasyon sou entènèt','Li chanje modpas nou','Li limen òdinatè a'], opts_en:['It deletes files','It helps us find information on the internet','It changes our password','It turns the computer on'], correct:1, exp:'Motè rechèch la ede nou jwenn enfòmasyon.', exp_en:'A search engine helps us find information.'},
          {q:'Poukisa nou itilize onglè (tabs) nan yon navigatè?', q_en:'Why do we use tabs in a browser?', opts:['Pou fèmen òdinatè a','Pou louvri plizyè sit anmenm tan','Pou chanje koulè ekran an','Pou efase istwa nou'], opts_en:['To close the computer','To have several sites open at once','To change the screen color','To delete our history'], correct:1, exp:'Onglè yo kite nou louvri plizyè paj anmenm tan.', exp_en:'Tabs let us have multiple pages open at once.'}
        ]
      }
    ]
  },

function t(key){
  const entry = UI[key];
  if(!entry) return '';
  return entry[lang] !== undefined ? entry[lang] : entry.ht;
}

/* Look up a bilingual field on a lesson/section/quiz object: L(obj,'title')
   returns obj.title_en when in English mode and present, else obj.title. */
function L(obj, field){
  if(lang === 'en'){
    const enVal = obj[field + '_en'];
    if(enVal !== undefined) return enVal;
  }
  return obj[field];
}

function fmtProgress(done,total){
  return lang==='en' ? (done+'/'+total+' lessons finished') : (done+'/'+total+' leson fini');
}
function fmtLessonCount(total){
  return lang==='en' ? (total+' lesson'+(total!==1?'s':'')) : (total+' leson');
}
function formatToday(){
  const d = new Date();
  if(lang==='en'){
    return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  }
  const months=['Janvye','Fevriye','Mas','Avril','Me','Jen','Jiyè','Out','Septanm','Oktòb','Novanm','Desanm'];
  return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}

/* ---------------------------------------------------------
   STATE + PERSISTENCE
   Progress is saved per-name to localStorage on THIS device/
   browser only (there is no server — nothing leaves the device).
   If storage is unavailable, everything still works for the
   current session, it just won't be remembered after closing.
--------------------------------------------------------- */
const STORAGE_KEY = 'aprann-ak-nou-data-v1';

const state = {
  completed:{ konpite:new Set(), angle:new Set(), python:new Set() },
  currentTrack:null,
  currentLessonIdx:null,
  currentUser:null
};

let allUsersData = {}; // { name: { konpite:[idx,...], angle:[...], python:[...] } }

function loadAllUsersData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    allUsersData = raw ? JSON.parse(raw) : {};
  }catch(e){
    allUsersData = {};
  }
}

function persistAllUsersData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allUsersData));
  }catch(e){
    // storage unavailable (private browsing, etc.) — progress still works this session
  }
}

function saveCurrentUserProgress(){
  if(!state.currentUser) return;
  allUsersData[state.currentUser] = {
    konpite: Array.from(state.completed.konpite),
    angle: Array.from(state.completed.angle),
    python: Array.from(state.completed.python)
  };
  persistAllUsersData();
}

/* ---------------------------------------------------------
   SYNC TO RRA (Google Sheet via Apps Script)
   Events are queued on the phone and sent when online.
   Nothing is lost offline: the queue waits until it can send.
--------------------------------------------------------- */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbw3BJ1LlMHffmgt34SRndJiw3xx-kbeL1cCUGt8vPrGjOM1yzENQgZNPYS_9PUrIq8POw/exec';
const APP_VERSION = '1.1';
const QUEUE_KEY = 'aprann-ak-nou-queue-v1';
const DEVICE_KEY = 'aprann-ak-nou-device-v1';
function backendOn(){ return /^https:\/\/script\.google\.com\//.test(BACKEND_URL); }
function makeId(){ return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }
let deviceId = 'unknown';
try{
  deviceId = localStorage.getItem(DEVICE_KEY) || '';
  if(!deviceId){ deviceId = 'd-'+makeId(); localStorage.setItem(DEVICE_KEY, deviceId); }
}catch(e){ deviceId = 'd-'+makeId(); }
let syncQueue = [];
try{ syncQueue = JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){ syncQueue = []; }
function saveQueue(){ try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(syncQueue.slice(-500))); }catch(e){} }
function queueEvent(type, extra){
  if(!state.currentUser) return;
  const ev = Object.assign({
    id: makeId(), ts: new Date().toISOString(), device: deviceId,
    student: state.currentUser, event: type, lang: lang, app: APP_VERSION,
    konpite: state.completed.konpite.size, angle: state.completed.angle.size, python: state.completed.python.size,
    totalLessons: TRACKS.konpite.lessons.length + TRACKS.angle.lessons.length + TRACKS.python.lessons.length
  }, extra||{});
  syncQueue.push(ev); saveQueue(); flushQueue();
}
let flushing = false;
async function flushQueue(){
  if(flushing || !backendOn() || !syncQueue.length) return;
  if(typeof navigator!=='undefined' && navigator.onLine===false) return;
  flushing = true;
  const batch = syncQueue.slice(0,25);
  let sentOk = false;
  try{
    const res = await fetch(BACKEND_URL, {method:'POST', body: JSON.stringify({events: batch})});
    const data = await res.json();
    if(data && data.ok){
      const sent = new Set(batch.map(e=>e.id));
      syncQueue = syncQueue.filter(e=>!sent.has(e.id)); saveQueue();
      sentOk = true;
    }
  }catch(e){ /* offline or server busy: try again later */ }
  flushing = false;
  if(sentOk && syncQueue.length) setTimeout(flushQueue, 2000);
}
window.addEventListener('online', flushQueue);
setInterval(flushQueue, 60000);
function syncStatusText(){
  if(!backendOn()) return t('syncOff');
  return syncQueue.length ? t('syncPending').replace('{n}', syncQueue.length) : t('syncAllSent');
}

function isTrackComplete(trackKey){
  return state.completed[trackKey].size >= TRACKS[trackKey].lessons.length;
}
function isAllComplete(){
  return isTrackComplete('konpite') && isTrackComplete('angle') && isTrackComplete('python');
}

function renderNameScreen(){
  const names = Object.keys(allUsersData);
  const wrap = document.getElementById('name-list-wrap');
  const list = document.getElementById('name-list');
  list.innerHTML = '';
  if(names.length){
    wrap.style.display = 'block';
    names.forEach(name=>{
      const chip = document.createElement('button');
      chip.className='name-chip';
      chip.textContent = name;
      chip.onclick = ()=>selectUser(name);
      list.appendChild(chip);
    });
  } else {
    wrap.style.display = 'none';
  }
  document.getElementById('name-input').value = '';
}

function startWithName(){
  const val = document.getElementById('name-input').value.trim();
  if(!val){
    document.getElementById('name-input').focus();
    return;
  }
  selectUser(val);
}

function selectUser(name){
  state.currentUser = name;
  const saved = allUsersData[name] || {};
  state.completed = {
    konpite: new Set(saved.konpite || []),
    angle: new Set(saved.angle || []),
    python: new Set(saved.python || [])
  };
  if(!allUsersData[name]) saveCurrentUserProgress();
  updateUserBadge();
  queueEvent('open');
  goHome();
}

function changeUser(){
  state.currentUser = null;
  state.currentTrack = null;
  state.currentLessonIdx = null;
  updateUserBadge();
  renderNameScreen();
  showScreen('screen-name');
}

function updateUserBadge(){
  const badge = document.getElementById('user-badge');
  if(state.currentUser){
    badge.style.display = 'flex';
    document.getElementById('user-badge-name').textContent = '👤 ' + state.currentUser;
  } else {
    badge.style.display = 'none';
  }
}

    names.forEach(name=>{

function renderTrackCards(){
  const container = document.getElementById('track-cards');
  container.innerHTML='';
  Object.values(TRACKS).forEach(track=>{
    const total = track.lessons.length;
    const done = state.completed[track.key].size;
    const pct = Math.round((done/total)*100);
    const complete = done>=total;
    const card = document.createElement('button');
    card.className='track-card';
    card.style.setProperty('--track-color',track.color);
    card.onclick=()=>openTrack(track.key);
    card.innerHTML=`
      <span class="emoji">${track.emoji}</span>
      <h3>${L(track,'label')}</h3>
      <p>${fmtLessonCount(total)}</p>
      <div class="progress-bar"><div style="width:${pct}%;background:${track.color}"></div></div>
      <p class="progress-label">${fmtProgress(done,total)}</p>
      ${complete?'<span class="cert-pill">🏆 '+(lang==='en'?'Certified':'Sètifye')+'</span>':''}
    `;
    container.appendChild(card);
  });
}

  document.getElementById('track-title').textContent = L(track,'label');

  const total = track.lessons.length;
  const done = state.completed[track.key].size;
  const pct = Math.round((done/total)*100);
  document.getElementById('track-progress-label').textContent = fmtProgress(done,total);
  const fill = document.getElementById('track-progress-fill');
  fill.style.width = pct+'%';
  fill.style.background = track.color;

  const certBtn = document.getElementById('track-cert-btn');

    certRow.style.display = 'flex';
    certBtn.textContent = '🏆 ' + t('trackCertBtn');

/* ---------------------------------------------------------
   MINI-ACTIVITIES: click-practice & typing-practice
--------------------------------------------------------- */
function renderActivity(activity){
  const area = document.getElementById('activity-area');
  if(activity.type==='click'){
    let clicks = 0;
    area.innerHTML = `
      <h3>${t('practiceHeading')}</h3>
      <p>${L(activity,'label')} — <span id="click-count">0</span>/${activity.goal}</p>
      <div class="click-area" id="click-area"></div>
      <div id="click-done" class="score-banner" style="display:none;">${t('clickDoneMsg')}</div>
    `;
    const zone = document.getElementById('click-area');
    function placeTarget(){
      const btn = document.createElement('button');
      btn.className='click-target';
      btn.textContent='●';
      const maxX = Math.max(zone.clientWidth-56,0);
      const maxY = Math.max(zone.clientHeight-56,0);
      btn.style.left = Math.random()*maxX+'px';
      btn.style.top = Math.random()*maxY+'px';
      btn.onclick = ()=>{
        clicks++;
        document.getElementById('click-count').textContent = Math.min(clicks,activity.goal);
        if(clicks>=activity.goal){
          zone.innerHTML='';
          document.getElementById('click-done').style.display='block';
        } else {
          zone.removeChild(btn);
          placeTarget();
        }
      };
      zone.appendChild(btn);
    }
    placeTarget();
  } else if(activity.type==='typing'){
    const target = L(activity,'target');
    area.innerHTML = `
      <h3>${t('typingHeading')}</h3>
      <p>${L(activity,'label')}:</p>
      <p style="font-weight:600;">"${target}"</p>
      <div class="type-practice">
        <input type="text" id="type-input" placeholder="${t('typingInputPh')}">
      </div>
      <div class="row">
        <button class="btn secondary" onclick="checkTyping('${target.replace(/'/g,"\\'")}')">${t('typingVerifyBtn')}</button>
        <span id="type-feedback"></span>
      </div>
    `;
  }
}

function checkTyping(target){
  const val = document.getElementById('type-input').value.trim().toLowerCase();
  const feedback = document.getElementById('type-feedback');
  if(val === target.trim().toLowerCase()){
    feedback.innerHTML = '<span style="color:var(--green);font-weight:600;">'+t('typingCorrect')+'</span>';
  } else {
    feedback.innerHTML = '<span style="color:var(--red);">'+t('typingWrong')+'</span>';
  }
}

/* ---------------------------------------------------------
   QUIZ RENDERING
--------------------------------------------------------- */
function renderQuiz(quiz){
  const area = document.getElementById('quiz-area');
  area.innerHTML='';
  const answered = new Array(quiz.length).fill(false);
  window._quizCorrect = 0; window._quizTotal = quiz.length;

  quiz.forEach((q,qi)=>{
    const block = document.createElement('div');
    block.className='q-block';
    const qText = L(q,'q');
    const qTextHtml = qText.split('\n').map(l=>l).join('<br>');
    block.innerHTML = `<p class="q-text">${qi+1}. ${qTextHtml}</p><div class="q-options"></div><p class="q-feedback"></p>`;
    const optsWrap = block.querySelector('.q-options');
    const opts = (lang==='en' && q.opts_en) ? q.opts_en : q.opts;
    opts.forEach((opt,oi)=>{
      const optBtn = document.createElement('button');
      optBtn.className='q-opt';
      optBtn.textContent = opt;
      optBtn.onclick = ()=>{
        if(answered[qi]) return;
        answered[qi]=true;
        const allOpts = optsWrap.querySelectorAll('.q-opt');
        allOpts.forEach(o=>o.disabled=true);
        if(oi===q.correct){
          window._quizCorrect++;
          optBtn.classList.add('correct');
        } else {
          optBtn.classList.add('wrong');
          allOpts[q.correct].classList.add('correct');
        }
        block.querySelector('.q-feedback').textContent = L(q,'exp') || '';
        checkAllAnswered(answered);
      };
      optsWrap.appendChild(optBtn);
    });
    area.appendChild(block);
  });

  window._currentAnswered = answered;
}

function checkAllAnswered(answered){
  const allDone = answered.every(a=>a);
  const btn = document.getElementById('finish-btn');
  if(btn) btn.disabled = !allDone;
}

/* ---------------------------------------------------------
   CELEBRATION: confetti + balloons
--------------------------------------------------------- */
function celebrate(size){
  const layer = document.getElementById('celebrate-layer');
  const colors = ['#00209F','#D21034','#f4b400','#1a7a3c','#ffffff'];
  const confettiCount = size==='track' ? 60 : 24;
  const balloonCount = size==='track' ? 10 : 3;
  const balloonEmojis = ['🎈','🎉','✨'];

  for(let i=0;i<confettiCount;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random()*100)+'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    const duration = 2.2 + Math.random()*1.6;
    const delay = Math.random()*0.4;
    piece.style.animationDuration = duration+'s';
    piece.style.animationDelay = delay+'s';
    layer.appendChild(piece);
    setTimeout(()=>{ if(piece.parentNode) piece.parentNode.removeChild(piece); }, (duration+delay)*1000+200);
  }
  for(let i=0;i<balloonCount;i++){
    const piece = document.createElement('div');
    piece.className = 'balloon-piece';
    piece.style.left = (Math.random()*90)+'vw';
    piece.textContent = balloonEmojis[Math.floor(Math.random()*balloonEmojis.length)];
    const duration = 2.6 + Math.random()*1.6;
    const delay = Math.random()*0.5;
    piece.style.animationDuration = duration+'s';
    piece.style.animationDelay = delay+'s';
    layer.appendChild(piece);
    setTimeout(()=>{ if(piece.parentNode) piece.parentNode.removeChild(piece); }, (duration+delay)*1000+200);
  }
}

/* ---------------------------------------------------------
   FINISH LESSON
--------------------------------------------------------- */
function finishLesson(){
  const track = TRACKS[state.currentTrack];
  const idx = state.currentLessonIdx;
  const alreadyDone = state.completed[track.key].has(idx);
  state.completed[track.key].add(idx);
  saveCurrentUserProgress();

  const resultDiv = document.getElementById('quiz-result');
  const total = track.lessons.length;
  const done = state.completed[track.key].size;
  const trackNowComplete = done>=total;
  const allNowComplete = isAllComplete();

  if(!alreadyDone){
    celebrate(trackNowComplete ? 'track' : 'lesson');
  }
  queueEvent(alreadyDone ? 'lesson_repeat' : 'lesson_done', {
    track: track.key, lesson: idx+1, lessonTitle: track.lessons[idx].title,
    score: (typeof window._quizCorrect==='number') ? window._quizCorrect : '',
    quizTotal: (typeof window._quizTotal==='number') ? window._quizTotal : '',
    trackDone: (!alreadyDone && trackNowComplete) ? 'yes' : '', allDone: (!alreadyDone && allNowComplete) ? 'yes' : ''
  });

  if(resultDiv){
    if(!alreadyDone && trackNowComplete){
      let extra = '<div class="celebrate-banner"><p><strong>'+t('celebrateTrackTitle')+'</strong></p><p>'+t('celebrateTrackMsg')+'</p>';
      if(allNowComplete){
        extra += '<p>'+t('celebrateAllMsg')+'</p><div class="row"><button class="btn gold" onclick="openCertificate(\'all\')">'+t('viewCertNowBtn')+'</button></div>';
      } else {
        extra += '<div class="row"><button class="btn gold" onclick="openCertificate(\''+track.key+'\')">'+t('viewCertNowBtn')+'</button></div>';
      }
      extra += '</div>';
      resultDiv.innerHTML = '<div class="score-banner">✅ '+t('lessonDoneMsg')+'</div>'+extra;
    } else {
      resultDiv.innerHTML = '<div class="score-banner">✅ '+t('lessonDoneMsg')+'</div>';
    }
  }

  const btn = document.getElementById('finish-btn');
  if(btn){
    btn.textContent = t('finishBtnDone');
    btn.disabled = true;
  }

  if(idx < total-1){
    const nextBtn = document.createElement('button');
    nextBtn.className='btn';
    nextBtn.style.marginTop='10px';
    nextBtn.textContent=t('nextLessonBtn');
    nextBtn.onclick = ()=>openLesson(idx+1);
    document.getElementById('lesson-content').appendChild(nextBtn);
  }
}

/* ---------------------------------------------------------
   CERTIFICATE
--------------------------------------------------------- */
function renderCertificate(scope){
  const wrap = document.getElementById('cert-wrap');
  const name = state.currentUser || '';
  const date = formatToday();
  let courseLine, titleText;
  if(scope==='all'){
    titleText = t('certTitleAll');
    courseLine = t('certLineCompletedAll');
  } else {
    const track = TRACKS[scope];
    titleText = t('certTitleTrack');
    courseLine = t('certLineCompletedTrack') + ' <span class="cert-course">' + track.emoji + ' ' + L(track,'label') + '</span>';
  }
  wrap.innerHTML = `
    <div class="cert-seal">🏅</div>
    <p class="cert-kicker">${t('certKicker')}</p>
    <h2 class="cert-title">${titleText}</h2>
    <p class="cert-line">${t('certLineThisCertifies')}</p>
    <div class="cert-name">${name || '—'}</div>
    <p class="cert-line">${courseLine}</p>
    <p class="cert-org">🇭🇹 ${t('certOrg')}</p>
    <p class="cert-date">${t('certDatePrefix')}: ${date}</p>
  `;
}

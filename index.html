<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprann Ak Nou!</title>
<meta name="theme-color" content="#00209F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aprann">
<style>
  :root{
    --blue:#00209F;
    --red:#D21034;
    --green:#1a7a3c;
    --gold:#f4b400;
    --ink:#1c2130;
    --paper:#fffdf8;
    --card:#ffffff;
    --muted:#6b7280;
    --ring:#e6e2d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:0;
    background:linear-gradient(180deg,#f7f5ef 0%,#fffdf8 400px);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:20px 16px 64px;
  }
  header.top{
    display:flex;
    align-items:center;
    gap:12px;
    padding:18px 0 8px;
    flex-wrap:wrap;
  }
  header.top .badge{
    width:48px;height:48px;border-radius:14px;
    background:linear-gradient(135deg,var(--blue),var(--red));
    display:flex;align-items:center;justify-content:center;
    font-size:24px;flex-shrink:0;
  }
  header.top h1{
    font-size:1.35rem;
    margin:0;
  }
  header.top p.sub{
    margin:2px 0 0;
    color:var(--muted);
    font-size:0.9rem;
  }
  .header-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .user-badge{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:999px;
    padding:6px 8px 6px 14px;
    font-size:0.9rem;
    font-weight:600;
  }
  .lang-toggle{
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:999px;
    padding:8px 14px;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .lang-toggle:hover{border-color:var(--blue);}
  .btn.secondary.small{
    padding:6px 12px;
    font-size:0.8rem;
    border-radius:999px;
  }
  .name-chip{
    background:#fff;
    border:1px solid var(--ring);
    border-radius:999px;
    padding:8px 14px;
    cursor:pointer;
    font-size:0.9rem;
  }
  .name-chip:hover{border-color:var(--blue);}
  .progress-table{
    width:100%;
    border-collapse:collapse;
    margin-top:14px;
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:14px;
    overflow:hidden;
  }
  .progress-table th, .progress-table td{
    padding:10px 12px;
    text-align:left;
    border-bottom:1px solid var(--ring);
    font-size:0.92rem;
  }
  .progress-table th{background:#faf9f5;}
  .empty-note{color:var(--muted);font-size:0.92rem;margin-top:14px;}
  .screen{display:none;}
  .screen.active{display:block;}
  .intro-card{
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:18px;
    padding:18px 20px;
    margin:18px 0 24px;
  }
  .intro-card p{margin:0 0 8px;}
  .intro-card p:last-child{margin-bottom:0;}
  .tracks{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:16px;
  }
  .track-card{
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:18px;
    padding:20px;
    cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .track-card:hover, .track-card:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
  }
  .track-card .emoji{font-size:2.2rem;}
  .track-card h3{margin:0;font-size:1.15rem;}
  .track-card p{margin:0;color:var(--muted);font-size:0.9rem;}
  .track-card .cert-pill{
    display:inline-block;
    background:#fff8e6;
    border:1px solid var(--gold);
    color:#8a6300;
    border-radius:999px;
    padding:3px 10px;
    font-size:0.78rem;
    font-weight:700;
    width:fit-content;
  }
  .progress-bar{
    height:10px;
    border-radius:6px;
    background:#eee;
    overflow:hidden;
  }
  .progress-bar > div{
    height:100%;
    border-radius:6px;
    background:var(--track-color,var(--blue));
    transition:width .3s ease;
  }
  .progress-label{font-size:0.8rem;color:var(--muted);}
  button{
    font-family:inherit;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:12px 18px;
    font-size:1rem;
    cursor:pointer;
    font-weight:600;
  }
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--ring);
  }
  .btn.gold{
    background:linear-gradient(135deg,var(--gold),#e08e00);
    color:#3a2900;
  }
  .btn.back{
    background:transparent;
    color:var(--blue);
    padding:8px 4px;
    font-weight:600;
  }
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .lesson-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:16px;
  }
  .lesson-item{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:14px;
    padding:14px 16px;
    cursor:pointer;
    text-align:left;
  }
  .lesson-item:hover{background:#faf9f5;}
  .lesson-item .num{
    width:34px;height:34px;border-radius:50%;
    background:var(--ring);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;flex-shrink:0;
    font-size:0.95rem;
  }
  .lesson-item.done .num{background:var(--green);color:#fff;}
  .lesson-item .title{font-weight:600;}
  .lesson-item .check{margin-left:auto;font-size:1.2rem;color:var(--green);white-space:nowrap;}
  .lesson-item .check .more{font-size:0.8rem;font-weight:700;color:#a86b00;background:#fff3cd;border-radius:10px;padding:2px 7px;}
  .score-banner.warn{background:#fff3cd;color:#7a5200;border:1px solid #f0d58a;}
  .track-title-row{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    margin-top:6px;
  }
  .track-title-row .emoji{font-size:1.8rem;}
  .lesson-content{
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:18px;
    padding:22px;
    margin-top:16px;
  }
  .lesson-content h2{margin-top:0;}
  .section{margin:18px 0;}
  .section h4{margin:0 0 6px;color:var(--blue);}
  .vocab-table{
    width:100%;
    border-collapse:collapse;
    margin:10px 0;
  }
  .vocab-table td, .vocab-table th{
    border-bottom:1px solid var(--ring);
    padding:8px 6px;
    text-align:left;
    font-size:0.95rem;
  }
  code.block{
    display:block;
    background:#1c2130;
    color:#e9f1ff;
    padding:14px 16px;
    border-radius:10px;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    white-space:pre;
    overflow-x:auto;
    margin:10px 0;
    font-size:0.92rem;
  }
  .tip{
    background:#fff8e6;
    border:1px solid #f0dca0;
    border-radius:12px;
    padding:10px 14px;
    font-size:0.92rem;
    margin:10px 0;
  }
  .activity{
    margin-top:22px;
    border-top:2px dashed var(--ring);
    padding-top:18px;
  }
  .activity h3{margin-top:0;}
  .q-block{
    background:#faf9f5;
    border:1px solid var(--ring);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .q-block p.q-text{font-weight:600;margin:0 0 10px;}
  .q-options{display:flex;flex-direction:column;gap:8px;}
  .q-opt{
    text-align:left;
    background:#fff;
    border:1px solid var(--ring);
    border-radius:10px;
    padding:10px 12px;
    cursor:pointer;
    font-size:0.95rem;
  }
  .q-opt:hover{border-color:var(--blue);}
  .q-opt.correct{background:#e6f6ec;border-color:var(--green);}
  .q-opt.wrong{background:#fdeaea;border-color:var(--red);}
  .q-opt[disabled]{cursor:default;}
  .q-feedback{margin-top:8px;font-size:0.9rem;color:var(--muted);}
  .click-area{
    position:relative;
    height:220px;
    background:#f3f6ff;
    border:2px dashed #c9d4f5;
    border-radius:14px;
    margin:14px 0;
    overflow:hidden;
  }
  .click-target{
    position:absolute;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--red);
    color:#fff;
    border:none;
    font-size:1.4rem;
    cursor:pointer;
  }
  .type-practice input{
    width:100%;
    font-size:1.1rem;
    padding:10px 12px;
    border:1px solid var(--ring);
    border-radius:10px;
    font-family:monospace;
  }
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;}
  .score-banner{
    background:#e6f6ec;
    border:1px solid var(--green);
    border-radius:14px;
    padding:14px 16px;
    margin-top:14px;
    font-weight:600;
  }
  .celebrate-banner{
    background:linear-gradient(135deg,#fff8e6,#ffe9c7);
    border:1px solid var(--gold);
    border-radius:14px;
    padding:16px 18px;
    margin-top:14px;
    font-weight:600;
  }
  .celebrate-banner p{margin:0 0 10px;}
  .celebrate-banner p:last-child{margin-bottom:0;}
  footer.note{
    margin-top:40px;
    padding-top:16px;
    border-top:1px solid var(--ring);
    color:var(--muted);
    font-size:0.85rem;
  }
  details.trainer{
    margin-top:20px;
    background:#f3f6ff;
    border:1px solid #c9d4f5;
    border-radius:14px;
    padding:12px 16px;
  }
  details.trainer summary{cursor:pointer;font-weight:600;color:var(--blue);}
  details.trainer ul{margin:10px 0 0;padding-left:20px;}

  /* ---------- Confetti / balloon celebration ---------- */
  #celebrate-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:999;
  }
  .confetti-piece{
    position:absolute;
    top:-20px;
    width:10px;height:16px;
    opacity:0.95;
    animation-name:confetti-fall;
    animation-timing-function:ease-in;
    animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(540deg); opacity:0.3; }
  }
  .balloon-piece{
    position:absolute;
    bottom:-60px;
    font-size:2.2rem;
    animation-name:balloon-rise;
    animation-timing-function:ease-out;
    animation-fill-mode:forwards;
  }
  @keyframes balloon-rise{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(-115vh) rotate(12deg); opacity:0; }
  }

  /* ---------- Certificate ---------- */
  .cert-wrap{
    background:var(--card);
    border:3px solid var(--gold);
    border-radius:20px;
    padding:36px 28px;
    margin-top:16px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .cert-wrap::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;height:10px;
    background:repeating-linear-gradient(90deg,var(--blue) 0 20px,var(--red) 20px 40px);
  }
  .cert-seal{font-size:2.6rem;margin-bottom:6px;}
  .cert-kicker{
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--muted);
    font-size:0.8rem;
    font-weight:700;
    margin:0 0 6px;
  }
  .cert-title{
    font-size:1.7rem;
    margin:0 0 18px;
    color:var(--blue);
  }
  .cert-line{margin:6px 0;font-size:1rem;}
  .cert-name{
    font-size:1.8rem;
    font-weight:800;
    margin:10px 0;
    color:var(--ink);
    border-bottom:2px solid var(--ring);
    display:inline-block;
    padding:0 10px 6px;
  }
  .cert-course{font-size:1.15rem;font-weight:700;color:var(--green);margin:8px 0 4px;}
  .cert-org{margin-top:22px;font-weight:700;color:var(--blue);}
  .cert-date{color:var(--muted);font-size:0.9rem;margin-top:4px;}
  @media print{
    body *{visibility:hidden;}
    #cert-print-area, #cert-print-area *{visibility:visible;}
    #cert-print-area{position:absolute;top:0;left:0;width:100%;}
    .no-print{display:none !important;}
  }

  @media (max-width:480px){
    header.top h1{font-size:1.15rem;}
    .lesson-content{padding:16px;}
    .cert-wrap{padding:24px 16px;}
    .cert-name{font-size:1.4rem;}
  }

  /* ===== v2: profiles, PIN, leaderboard, streaks, voice ===== */
  .profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:12px;}
  .profile-btn{background:#fff;border:2px solid var(--ring);border-radius:16px;padding:14px 8px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;font-size:1rem;font-weight:700;color:var(--ink);}
  .profile-btn .av{font-size:2.2rem;line-height:1;}
  .profile-btn.new{border-style:dashed;color:var(--blue);}
  .profile-btn:hover{border-color:var(--blue);}
  .avatar-pick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;}
  .avatar-pick button{font-size:1.7rem;background:#fff;border:2px solid var(--ring);border-radius:12px;width:52px;height:52px;cursor:pointer;}
  .avatar-pick button.sel{border-color:var(--blue);background:#eef2ff;}
  .field-label{font-weight:700;margin:14px 0 4px;display:block;}
  .text-in{width:100%;font-size:1.05rem;padding:12px 14px;border:1px solid var(--ring);border-radius:10px;}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin:14px 0;}
  .pin-dots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--blue);}
  .pin-dots span.on{background:var(--blue);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;}
  .pin-pad button{height:58px;font-size:1.4rem;font-weight:700;border-radius:14px;border:1px solid var(--ring);background:#fff;cursor:pointer;}
  .pin-pad button:active{background:#eef2ff;}
  .pin-msg{text-align:center;min-height:1.4em;font-weight:600;}
  .pin-msg.err{color:var(--red);}
  .center{text-align:center;}
  .stats-card{background:var(--card);border:1px solid var(--ring);border-radius:18px;padding:14px 18px;margin:0 0 18px;
    display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;}
  .stat .big{font-size:1.5rem;font-weight:800;line-height:1.1;}
  .stat .lbl{font-size:0.8rem;color:var(--muted);}
  .day-dots{display:flex;gap:5px;margin-top:4px;}
  .day-dots span{width:22px;height:22px;border-radius:50%;background:#eee;font-size:0.65rem;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;}
  .day-dots span.on{background:var(--green);color:#fff;}
  .day-dots span.today{outline:2px solid var(--gold);}
  .lb-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--ring);border-radius:14px;overflow:hidden;margin-top:10px;}
  .lb-table td,.lb-table th{padding:10px 12px;border-bottom:1px solid var(--ring);text-align:left;}
  .lb-table tr.me td{background:#fff8e1;font-weight:700;}
  .lb-rank{width:44px;font-weight:800;}
  .lb-pts{text-align:right !important;font-weight:700;}
  .goal-bar{height:14px;background:#eee;border-radius:999px;overflow:hidden;margin-top:6px;}
  .goal-bar div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));}
  .lb-card{background:var(--card);border:1px solid var(--ring);border-radius:16px;padding:14px 16px;margin-top:14px;}
  .say{border:none;background:#eef2ff;border-radius:999px;cursor:pointer;font-size:0.95rem;padding:2px 8px;margin-left:6px;vertical-align:middle;}
  .say:active{background:#c7d2fe;}
  .no-speech .say{display:none;}
  .voice-btn{display:block;width:100%;margin:0 0 16px;padding:14px 16px;border-radius:14px;border:2px solid var(--blue);
    background:#eef2ff;color:var(--blue);font-weight:800;font-size:1rem;cursor:pointer;text-align:left;}
  .voice-btn.playing{background:var(--blue);color:#fff;}
  .dialog-line{display:flex;gap:10px;align-items:flex-start;margin:8px 0;}
  .dialog-line .who{font-weight:800;min-width:64px;}
  .dialog-line .ht{color:var(--muted);font-size:0.9rem;}
  .rules{font-size:0.88rem;color:var(--muted);}
  /* ===== v3: order activity, daily challenge, levels, badges, toast, mini chart ===== */
  .order-answer{min-height:54px;border:2px dashed var(--ring);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;background:#fff;}
  .order-bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
  .order-answer.lines,.order-bank.lines{flex-direction:column;align-items:stretch;}
  .chip{font-size:1.05rem;font-weight:700;padding:9px 14px;border-radius:12px;border:2px solid var(--blue);background:#eef2ff;color:var(--ink);cursor:pointer;}
  .lines .chip{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;white-space:pre;text-align:left;font-size:0.95rem;overflow-x:auto;}
  .level-bar{height:12px;background:#eee;border-radius:8px;overflow:hidden;margin:8px 0 4px;}
  .level-bar div{height:100%;background:linear-gradient(90deg,var(--gold),#e08e00);}
  .badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .badge{font-size:1.5rem;width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);background:#fff8e1;cursor:pointer;padding:0;}
  .badge.off{filter:grayscale(1);opacity:0.35;border-color:var(--ring);background:#f3f3f3;}
  #toast-layer{position:fixed;left:0;right:0;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;}
  .toast{background:var(--ink);color:#fff;font-weight:700;padding:12px 18px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,0.25);max-width:90vw;text-align:center;animation:toastIn 0.3s ease;}
  @keyframes toastIn{from{transform:translateY(20px);opacity:0;}to{transform:none;opacity:1;}}
  .mini-chart{margin:10px 0;}
  .mc-row{display:flex;align-items:center;gap:8px;margin:6px 0;}
  .mc-lbl{width:84px;font-weight:600;font-size:0.92rem;}
  .mc-bar{height:22px;background:var(--blue);border-radius:6px;display:inline-block;}
  .mc-val{font-weight:700;}
</style>
</head>
<body>
<div id="celebrate-layer"></div>
<div class="wrap">

  <header class="top">
    <div class="badge">🇭🇹</div>
    <div>
      <h1>Aprann Ak Nou!</h1>
      <p class="sub" id="header-sub"></p>
    </div>
    <div class="header-actions">
      <button class="lang-toggle" id="lang-toggle-btn" onclick="toggleLang()"></button>
      <button class="lang-toggle" id="sound-toggle-btn" onclick="toggleSound()"></button>
      <div id="user-badge" class="user-badge" style="display:none;">
        <span id="user-badge-name"></span>
        <button class="btn secondary small" id="change-name-btn" onclick="changeUser()"></button>
      </div>
    </div>
  </header>

  <!-- PROFILE SCREEN: who's here? -->
  <section id="screen-name" class="screen active">
    <div class="intro-card">
      <h2 style="margin:0 0 4px;" id="who-title"></h2>
      <p id="who-sub" style="margin:0;"></p>
      <button class="voice-btn" type="button" data-voice="audio/m1.mp3" id="welcome-voice" onclick="toggleVoice(this, 'welcomeBtn')" style="margin-top:12px;"></button>
      <div class="profile-grid" id="profile-grid"></div>
      <div class="row" style="margin-top:16px;"><button class="btn secondary" type="button" id="find-me-btn" onclick="openRoster()"></button></div>
      <p class="rules" id="find-me-note" style="margin:8px 0 0;"></p>
    </div>
    <details class="trainer">
      <summary id="trainer-summary"></summary>
      <ul id="trainer-list"></ul>
    </details>
  </section>

  <!-- RETURNING KID: find my name in the club list (v3) -->
  <section id="screen-roster" class="screen">
    <button class="btn back" onclick="showProfiles()" id="back-btn-roster"></button>
    <div class="intro-card">
      <h2 style="margin:0 0 4px;" id="roster-title"></h2>

          {q:'Poukisa nou itilize onglè (tabs) nan yon navigatè?', q_en:'Why do we use tabs in a browser?', opts:['Pou fèmen òdinatè a','Pou louvri plizyè sit anmenm tan','Pou chanje koulè ekran an','Pou efase istwa nou'], opts_en:['To close the computer','To have several sites open at once','To change the screen color','To delete our history'], correct:1, exp:'Onglè yo kite nou louvri plizyè paj anmenm tan.', exp_en:'Tabs let us have multiple pages open at once.'}
        ]
      }
      ,
      {
        title:'Nivo 2 · Tablo: liy, kolòn ak adisyon', title_en:'Level 2 · Spreadsheets: rows, columns and adding',
        sections:[
          {h:'Ki sa yon tablo ye?', h_en:'What is a spreadsheet?', body:`
            <p>Yon <strong>tablo</strong> (spreadsheet), tankou <strong>Excel</strong> oswa <strong>Google Sheets</strong>, se yon fèy ki fèt ak ti bwat. Nou itilize l pou ekri chif, òganize enfòmasyon epi kalkile rapidman.</p>
            <table class="vocab-table">
              <tr><td><strong>Liy</strong> (Row)</td><td>Ale de agoch a adwat. Yo gen <strong>nimewo</strong>: 1, 2, 3…</td></tr>
              <tr><td><strong>Kolòn</strong> (Column)</td><td>Ale de anwo an ba. Yo gen <strong>lèt</strong>: A, B, C…</td></tr>
              <tr><td><strong>Selil</strong> (Cell)</td><td>Yon sèl ti bwat. Non l se lèt kolòn nan + nimewo liy nan. Egzanp: <strong>B2</strong></td></tr>
            </table>
            <p>Egzanp: pri nan yon boutik (pretann):</p>
            <table class="vocab-table">
              <tr><th></th><th>A</th><th>B</th></tr>
              <tr><td><strong>1</strong></td><td>Pwodui</td><td>Pri (goud)</td></tr>
              <tr><td><strong>2</strong></td><td>Diri (1 mamit)</td><td>500</td></tr>
              <tr><td><strong>3</strong></td><td>Pwa (1 mamit)</td><td>450</td></tr>
              <tr><td><strong>4</strong></td><td>Lwil (1 galon)</td><td>1200</td></tr>
            </table>
            <div class="tip">💡 Selil <strong>B3</strong> se 450 (pri pwa a).</div>
          `, body_en:`
            <p>A <strong>spreadsheet</strong>, like <strong>Excel</strong> or <strong>Google Sheets</strong>, is a sheet made of little boxes. We use it to write numbers, organize information and calculate quickly.</p>
            <table class="vocab-table">
              <tr><td><strong>Row</strong></td><td>Goes left to right. Rows have <strong>numbers</strong>: 1, 2, 3…</td></tr>
              <tr><td><strong>Column</strong></td><td>Goes top to bottom. Columns have <strong>letters</strong>: A, B, C…</td></tr>
              <tr><td><strong>Cell</strong></td><td>One little box. Its name is the column letter + the row number. Example: <strong>B2</strong></td></tr>
            </table>
            <p>Example: prices at a boutique (pretend):</p>
            <table class="vocab-table">
              <tr><th></th><th>A</th><th>B</th></tr>
              <tr><td><strong>1</strong></td><td>Product</td><td>Price (gourdes)</td></tr>
              <tr><td><strong>2</strong></td><td>Rice (1 marmite)</td><td>500</td></tr>
              <tr><td><strong>3</strong></td><td>Beans (1 marmite)</td><td>450</td></tr>
              <tr><td><strong>4</strong></td><td>Oil (1 gallon)</td><td>1200</td></tr>
            </table>
            <div class="tip">💡 Cell <strong>B3</strong> is 450 (the price of beans).</div>
          `},
          {h:'Adisyone ak SUM, fè mwayèn ak AVERAGE', h_en:'Adding with SUM, averages with AVERAGE', body:`
            <p>Yon <strong>fòmil</strong> toujou kòmanse ak siy <strong>=</strong>. Li fè kalkil la pou nou.</p>
            <table class="vocab-table">
              <tr><td><strong>=SUM(B2:B4)</strong></td><td>Adisyone tout chif ki soti nan B2 rive nan B4: 500 + 450 + 1200 = <strong>2150</strong></td></tr>
              <tr><td><strong>=AVERAGE(B2:B4)</strong></td><td>Mwayèn: total la divize pa konbyen chif genyen: 2150 ÷ 3 ≈ <strong>717</strong></td></tr>
            </table>
            <div class="tip">💡 <strong>B2:B4</strong> vle di "soti nan B2 rive nan B4". Si n chanje yon pri, fòmil la rekalkile poukont li!</div>
          `, body_en:`
            <p>A <strong>formula</strong> always starts with the <strong>=</strong> sign. It does the math for us.</p>
            <table class="vocab-table">
              <tr><td><strong>=SUM(B2:B4)</strong></td><td>Adds all the numbers from B2 to B4: 500 + 450 + 1200 = <strong>2150</strong></td></tr>
              <tr><td><strong>=AVERAGE(B2:B4)</strong></td><td>The average: the total divided by how many numbers there are: 2150 ÷ 3 ≈ <strong>717</strong></td></tr>
            </table>
            <div class="tip">💡 <strong>B2:B4</strong> means "from B2 to B4". If we change a price, the formula updates by itself!</div>
          `}
        ],
        activity:{type:'typing', target:'=SUM(B2:B4)', target_en:'=SUM(B2:B4)', label:'Tape fòmil ki adisyone B2 rive B4', label_en:'Type the formula that adds B2 to B4'},
        quiz:[
          {q:'Nan yon tablo, kolòn yo gen…', q_en:'In a spreadsheet, columns have…', opts:['Nimewo','Lèt','Koulè','Foto'], opts_en:['Numbers','Letters','Colors','Photos'], correct:1, exp:'Kolòn yo gen lèt (A, B, C), liy yo gen nimewo (1, 2, 3).', exp_en:'Columns have letters (A, B, C); rows have numbers (1, 2, 3).'},
          {q:'Ki non selil ki nan kolòn C, liy 5 la?', q_en:'What is the name of the cell in column C, row 5?', opts:['5C','C5','CC5','C-5'], opts_en:['5C','C5','CC5','C-5'], correct:1, exp:'Lèt kolòn nan anvan, apre sa nimewo liy nan: C5.', exp_en:'Column letter first, then the row number: C5.'},
          {q:'Ki fòmil ki adisyone chif ki soti nan B2 rive nan B4?', q_en:'Which formula adds the numbers from B2 to B4?', opts:['=SUM(B2:B4)','SUM B2 B4','=B2-B4','=AVERAGE(B2:B4)'], opts_en:['=SUM(B2:B4)','SUM B2 B4','=B2-B4','=AVERAGE(B2:B4)'], correct:0, exp:'=SUM(...) adisyone tout chif ki nan ranje a.', exp_en:'=SUM(...) adds all the numbers in the range.'},
          {q:'Si B2 = 500, B3 = 450 ak B4 = 1200, konbyen =SUM(B2:B4) ap bay?', q_en:'If B2 = 500, B3 = 450 and B4 = 1200, what does =SUM(B2:B4) give?', opts:['1650','2150','1200','717'], opts_en:['1650','2150','1200','717'], correct:1, exp:'500 + 450 + 1200 = 2150.', exp_en:'500 + 450 + 1200 = 2150.'}
        ]
      },
      {
        title:'Nivo 2 · Ki sa done ye? Ann konte kominote nou', title_en:'Level 2 · What is data? Counting our community',
        sections:[
          {h:'Done se enfòmasyon nou ka konte', h_en:'Data is information we can count', body:`
            <p><strong>Done</strong> (data) se enfòmasyon nou ranmase pou nou konprann yon bagay pi byen. Egzanp: konbyen timoun ki ale lekòl, konbyen yon mamit diri koute, konbyen fontèn dlo ki ap mache.</p>
            <p>Yon bon rechèch kòmanse ak yon <strong>bon kesyon</strong>:</p>
            <table class="vocab-table">
              <tr><td>✅ Bon kesyon</td><td>"Konbyen fontèn dlo ki ap mache sou wout nou an?" (nou ka konte l)</td></tr>
              <tr><td>❌ Pa bon kesyon</td><td>"Èske katye a bèl?" (chak moun ap reponn yon lòt jan)</td></tr>
            </table>
          `, body_en:`
            <p><strong>Data</strong> is information we collect to understand something better. Examples: how many children go to school, how much a marmite of rice costs, how many water fountains are working.</p>
            <p>Good research starts with a <strong>good question</strong>:</p>
            <table class="vocab-table">
              <tr><td>✅ Good question</td><td>"How many water fountains are working on our road?" (we can count it)</td></tr>
              <tr><td>❌ Not a good question</td><td>"Is the neighborhood nice?" (everyone will answer differently)</td></tr>
            </table>
          `},
          {h:'Konte ak ti baton epi ekri inite a', h_en:'Counting with tally marks and writing the unit', body:`
            <p>Lè n ap konte, nou ka fè <strong>ti baton</strong>: ||||  pou 4, epi yon liy atravè pou 5. Apre sa, nou mete total la nan tablo a.</p>
            <table class="vocab-table">
              <tr><td><strong>Inite</strong> (Unit)</td><td>Toujou ekri <em>kisa</em> chif la vle di: 500 <strong>goud pou 1 mamit</strong>, pa sèlman "500".</td></tr>
              <tr><td><strong>Menm kote, menm fason</strong></td><td>Pou konpare chak mwa, ale nan <strong>menm boutik yo</strong> epi mande pou <strong>menm kantite</strong>.</td></tr>
              <tr><td><strong>Dat</strong></td><td>Toujou ekri dat ou ranmase done yo.</td></tr>
            </table>
            <div class="tip">💡 Yon chif san inite ak san dat pa itil anpil. "Diri: 500 goud / mamit, 7 novanm" se yon bon done!</div>
          `, body_en:`
            <p>When counting, we can use <strong>tally marks</strong>: |||| for 4, then a line across for 5. Then we put the total in the table.</p>
            <table class="vocab-table">
              <tr><td><strong>Unit</strong></td><td>Always write <em>what</em> the number means: 500 <strong>gourdes for 1 marmite</strong>, not just "500".</td></tr>
              <tr><td><strong>Same place, same way</strong></td><td>To compare each month, go to <strong>the same boutiques</strong> and ask for <strong>the same amount</strong>.</td></tr>
              <tr><td><strong>Date</strong></td><td>Always write the date you collected the data.</td></tr>
            </table>
            <div class="tip">💡 A number without a unit or a date isn't very useful. "Rice: 500 gourdes / marmite, Nov 7" is good data!</div>
          `}
        ],
        quiz:[
          {q:'Ki kesyon ki pi bon pou yon rechèch?', q_en:'Which question is best for research?', opts:['Èske katye a bèl?','Konbyen fontèn dlo ki ap mache sou wout nou an?','Ki moun ki pi janti?','Èske moun yo kontan?'], opts_en:['Is the neighborhood nice?','How many water fountains are working on our road?','Who is the nicest?','Are people happy?'], correct:1, exp:'Nou ka konte fontèn dlo yo, donk se yon bon kesyon.', exp_en:'We can count the water fountains, so it is a good question.'},
          {q:'Ki done ki pi konplè?', q_en:'Which data is most complete?', opts:['500','Diri 500','Diri: 500 goud / mamit, 7 novanm','Diri chè'], opts_en:['500','Rice 500','Rice: 500 gourdes / marmite, Nov 7','Rice is expensive'], correct:2, exp:'Li gen pwodui a, pri a, inite a ak dat la.', exp_en:'It has the product, the price, the unit and the date.'},
          {q:'Pou konpare pri chak mwa, sa nou dwe fè?', q_en:'To compare prices every month, what should we do?', opts:['Chanje boutik chak fwa','Ale nan menm boutik yo epi mande menm kantite','Devine pri a','Mande sèlman yon fwa'], opts_en:['Change boutiques every time','Go to the same boutiques and ask for the same amount','Guess the price','Ask only once'], correct:1, exp:'Menm kote, menm fason: konsa konparezon an jis.', exp_en:'Same place, same way: that way the comparison is fair.'}
        ]
      },
      {
        title:'Nivo 2 · Respè ak sekirite ak done', title_en:'Level 2 · Respect and safety with data',
        sections:[
          {h:'Règ pou ranmase done', h_en:'Rules for collecting data', body:`
            <table class="vocab-table">
              <tr><td>☀️</td><td>Travay <strong>lajounen sèlman</strong>, an <strong>ekip 2 oswa 3</strong>, ak yon <strong>granmoun</strong> (Albert oswa Roseline) toupre.</td></tr>
              <tr><td>🚪</td><td>Pa janm <strong>antre</strong> lakay moun. Poze kesyon an devan pòt la.</td></tr>
              <tr><td>🙈</td><td><strong>Pa ekri non pèsonn</strong>, pa pran foto moun, pa ekri adrès kay. Nou konte sèlman.</td></tr>
              <tr><td>🙏</td><td>Toujou di: <em>"Se yon devwa lekòl."</em> Si yon moun pa vle reponn: <em>"Pa gen pwoblèm, mèsi!"</em></td></tr>
              <tr><td>🚫</td><td>Pa poze kesyon sou politik, sou lajan fanmi an, oswa sou sante moun. Pa janm pwomèt moun anyen.</td></tr>
              <tr><td>🔒</td><td>Done yo rete <strong>andedan klib la</strong>. Pa poste yo sou entènèt.</td></tr>
            </table>
          `, body_en:`
            <table class="vocab-table">
              <tr><td>☀️</td><td>Work <strong>in daylight only</strong>, in <strong>teams of 2 or 3</strong>, with an <strong>adult</strong> (Albert or Roseline) nearby.</td></tr>
              <tr><td>🚪</td><td>Never <strong>go inside</strong> anyone's home. Ask your question at the door.</td></tr>
              <tr><td>🙈</td><td><strong>Don't write anyone's name</strong>, don't take photos of people, don't write house addresses. We only count.</td></tr>
              <tr><td>🙏</td><td>Always say: <em>"It's school homework."</em> If someone doesn't want to answer: <em>"No problem, thank you!"</em></td></tr>
              <tr><td>🚫</td><td>Don't ask about politics, family money, or anyone's health. Never promise people anything.</td></tr>
              <tr><td>🔒</td><td>The data stays <strong>inside the club</strong>. Don't post it online.</td></tr>
            </table>
          `}
        ],
        activity:{type:'typing', target:'Pa gen pwoblem, mesi', target_en:'No problem, thank you', label:'Tape sa pou di si yon moun pa vle reponn', label_en:"Type what to say if someone doesn't want to answer"},
        quiz:[
          {q:'Ak ki moun nou dwe ale ranmase done?', q_en:'Who should we go collect data with?', opts:['Poukont nou','An ekip, ak yon granmoun toupre','Ak moun nou pa konnen','Nenpòt moun'], opts_en:['Alone','In a team, with an adult nearby','With people we do not know','Anyone'], correct:1, exp:'Toujou an ekip, lajounen, ak yon granmoun toupre.', exp_en:'Always in a team, in daylight, with an adult nearby.'},
          {q:'Ki sa nou PA dwe ekri?', q_en:'What should we NOT write down?', opts:['Konbyen timoun ki ale lekòl','Non moun yo','Pri diri a','Konbyen fontèn dlo'], opts_en:['How many children go to school','People’s names','The price of rice','How many water fountains'], correct:1, exp:'Nou konte sèlman. Pa gen non.', exp_en:'We only count. No names.'},
          {q:'Si yon moun pa vle reponn, sa nou fè?', q_en:"If someone doesn't want to answer, what do we do?", opts:['Ensiste','Di "Pa gen pwoblèm, mèsi!" epi kontinye','Antre lakay li','Pwomèt li lajan'], opts_en:['Insist','Say "No problem, thank you!" and move on','Go into their home','Promise them money'], correct:1, exp:'Nou respekte chwa moun. Nou di mèsi epi nou kontinye.', exp_en:'We respect people’s choice. We say thank you and move on.'},
          {q:'Ki kote done klib la rete?', q_en:'Where does the club’s data stay?', opts:['Sou Facebook','Andedan klib la','Sou WhatsApp tout moun','Nan lari a'], opts_en:['On Facebook','Inside the club','In everyone’s WhatsApp','On the street'], correct:1, exp:'Done yo rete andedan klib la pou pwoteje kominote a.', exp_en:'The data stays inside the club to protect the community.'}
        ]
      },
      {
        title:'Nivo 2 · Ti pwojè pratik: Konte Dorigol', title_en:'Level 2 · Practice project: Count Dorigol',
        sections:[
          {h:'Done pretann pou pratike', h_en:'Pretend data for practice', body:`
            <p>Yon ekip konte bagay sa yo sou yon wout (done <strong>pretann</strong>, pou pratike sèlman):</p>
            <table class="vocab-table">
              <tr><th>Sa nou konte</th><th>Kantite</th></tr>
              <tr><td>Kay</td><td>40</td></tr>
              <tr><td>Boutik</td><td>3</td></tr>
              <tr><td>Lekòl</td><td>2</td></tr>
              <tr><td>Legliz</td><td>4</td></tr>
              <tr><td>Fontèn dlo (total)</td><td>5</td></tr>
              <tr><td>Fontèn dlo ki ap mache</td><td>2</td></tr>
            </table>
            <p>Yo poze kesyon nan 10 kay: gen <strong>24 timoun</strong>, epi <strong>18</strong> ladan yo ale lekòl.</p>
          `, body_en:`
            <p>A team counted these things on one road (<strong>pretend</strong> data, for practice only):</p>
            <table class="vocab-table">
              <tr><th>What we counted</th><th>Number</th></tr>
              <tr><td>Houses</td><td>40</td></tr>
              <tr><td>Boutiques</td><td>3</td></tr>
              <tr><td>Schools</td><td>2</td></tr>
              <tr><td>Churches</td><td>4</td></tr>
              <tr><td>Water fountains (total)</td><td>5</td></tr>
              <tr><td>Water fountains that work</td><td>2</td></tr>
            </table>
            <p>They asked at 10 houses: there are <strong>24 children</strong>, and <strong>18</strong> of them go to school.</p>
          `},
          {h:'Jwenn repons lan epi esplike l', h_en:'Find the answer and explain it', body:`
            <table class="vocab-table">
              <tr><td>Konbyen timoun ki pa ale lekòl?</td><td>24 − 18 = <strong>6</strong></td></tr>
              <tr><td>Ki pousantaj ki ale lekòl?</td><td>18 ÷ 24 = 0.75 = <strong>75%</strong></td></tr>
              <tr><td>Konbyen fontèn ki pa mache?</td><td>5 − 2 = <strong>3</strong></td></tr>
            </table>
            <p><strong>Esplike l an 2 fraz:</strong> "Sou wout nou an, 75% timoun nou konte ale lekòl, men 6 pa ale. Sou 5 fontèn dlo, se 2 sèlman ki ap mache."</p>
            <div class="tip">🏆 Lè w fini Nivo 2 ak omwen 70% nan quiz yo, ou ka patisipe nan <strong>vrè pwojè "Konte Dorigol"</strong> la, ak yon prim!</div>
          `, body_en:`
            <table class="vocab-table">
              <tr><td>How many children don't go to school?</td><td>24 − 18 = <strong>6</strong></td></tr>
              <tr><td>What percentage go to school?</td><td>18 ÷ 24 = 0.75 = <strong>75%</strong></td></tr>
              <tr><td>How many fountains don't work?</td><td>5 − 2 = <strong>3</strong></td></tr>
            </table>
            <p><strong>Explain it in 2 sentences:</strong> "On our road, 75% of the children we counted go to school, but 6 don't. Of 5 water fountains, only 2 work."</p>
            <div class="tip">🏆 When you finish Level 2 with at least 70% on the quizzes, you can join the <strong>real "Count Dorigol" project</strong>, with a prize!</div>
          `}
        ],
        activity:{type:'typing', target:'75%', target_en:'75%', label:'Ki pousantaj timoun ki ale lekòl? (tape repons lan)', label_en:'What percentage of children go to school? (type the answer)'},
        quiz:[
          {q:'Gen 24 timoun epi 18 ale lekòl. Konbyen ki pa ale?', q_en:'There are 24 children and 18 go to school. How many do not go?', opts:['4','6','8','18'], opts_en:['4','6','8','18'], correct:1, exp:'24 − 18 = 6.', exp_en:'24 − 18 = 6.'},
          {q:'18 sou 24 timoun ale lekòl. Ki pousantaj sa ye?', q_en:'18 out of 24 children go to school. What percentage is that?', opts:['18%','50%','75%','90%'], opts_en:['18%','50%','75%','90%'], correct:2, exp:'18 ÷ 24 = 0.75 = 75%.', exp_en:'18 ÷ 24 = 0.75 = 75%.'},
          {q:'Gen 5 fontèn dlo, 2 ap mache. Konbyen ki pa mache?', q_en:'There are 5 water fountains and 2 work. How many do not work?', opts:['2','3','5','7'], opts_en:['2','3','5','7'], correct:1, exp:'5 − 2 = 3.', exp_en:'5 − 2 = 3.'},
          {q:'Nan yon tablo, ki fòmil ki ka adisyone tout kay ki nan B2 rive B7?', q_en:'In a spreadsheet, which formula adds everything from B2 to B7?', opts:['=SUM(B2:B7)','=AVERAGE(B2:B7)','=B2+B7','SUM'], opts_en:['=SUM(B2:B7)','=AVERAGE(B2:B7)','=B2+B7','SUM'], correct:0, exp:'=SUM(B2:B7) adisyone tout selil ki soti nan B2 rive B7.', exp_en:'=SUM(B2:B7) adds every cell from B2 to B7.'}
        ]
      }
    ]
  },

  angle: {
    key:'angle', label:'Angle Debaz', label_en:'Basic English', emoji:'🔤', color:'var(--red)',
    lessons:[
      {
        title:'Salitasyon (Greetings)', title_en:'Greetings (Salitasyon)',
        sections:[
          {h:'Premye mo yo', h_en:'First words', body:`
            <table class="vocab-table">
              <tr><th>Kreyòl</th><th>Angle</th></tr>
              <tr><td>Bonjou</td><td><strong>Hello</strong></td></tr>
              <tr><td>Orevwa</td><td><strong>Goodbye</strong></td></tr>
              <tr><td>Souple</td><td><strong>Please</strong></td></tr>
              <tr><td>Mèsi</td><td><strong>Thank you</strong></td></tr>
              <tr><td>Wi</td><td><strong>Yes</strong></td></tr>
              <tr><td>Non</td><td><strong>No</strong></td></tr>
            </table>
          `}
        ],
        quiz:[
          {q:"Kijan pou di 'Mèsi' an Angle?", q_en:"How do you say 'Mèsi' in English?", opts:['Hello','Thank you','Please','Goodbye'], correct:1, exp:'"Thank you" vle di Mèsi.', exp_en:'"Thank you" means Mèsi.'},
          {q:"Kijan pou di 'Wi' an Angle?", q_en:"How do you say 'Wi' in English?", opts:['No','Please','Yes','Hello'], correct:2, exp:'"Yes" vle di Wi.', exp_en:'"Yes" means Wi.'},
          {q:"Ki mo Angle a ki vle di 'Souple'?", q_en:"Which English word means 'Souple'?", opts:['Please','Sorry','Goodbye','Thanks'], correct:0, exp:'"Please" vle di Souple.', exp_en:'"Please" means Souple.'}
        ]
      },
      {
        title:'Nimewo 1-20 (Numbers)', title_en:'Numbers 1-20',
        sections:[
          {h:'Konte an Angle', h_en:'Counting in English', body:`
            <table class="vocab-table">
              <tr><th>Kreyòl</th><th>Angle</th></tr>
              <tr><td>Youn</td><td><strong>One (1)</strong></td></tr>
              <tr><td>De</td><td><strong>Two (2)</strong></td></tr>
              <tr><td>Twa</td><td><strong>Three (3)</strong></td></tr>
              <tr><td>Kat</td><td><strong>Four (4)</strong></td></tr>

      {
        title:'Ki sa yon Pwogram Konpitè ye?', title_en:'What is a Computer Program?',
        sections:[
          {h:'Yon seri enstriksyon egzat', h_en:'A precise set of instructions', body:`
            <p>Yon <strong>pwogram</strong> se tankou yon resèt kizin (recipe) — se yon seri enstriksyon egzat, nan yon lòd espesifik, pou reyalize yon bagay.</p>
            <p>Egzanp — men enstriksyon pou leve maten:</p>
            <ol>
              <li>Leve nan kabann</li>
              <li>Abiye</li>
              <li>Bwose dan</li>
              <li>Manje</li>
              <li>Ale lekòl</li>
            </ol>
            <div class="tip">💡 Si nou chanje lòd la (pa egzanp, ale lekòl anvan nou leve!), sa pa ka mache. Nan pwogramasyon, lòd enstriksyon yo rele yon <strong>sekans</strong> (sequence), epi li trè enpòtan.</div>
            <p>Python se yon <strong>langaj pwogramasyon</strong> — yon fason espesyal pou nou bay òdinatè a enstriksyon egzat.</p>
          `, body_en:`
            <p>A <strong>program</strong> is like a kitchen recipe — it's a precise set of instructions, in a specific order, to accomplish something.</p>
            <p>Example — here are the instructions for getting up in the morning:</p>
            <ol>
              <li>Get out of bed</li>
              <li>Get dressed</li>
              <li>Brush your teeth</li>
              <li>Eat</li>
              <li>Go to school</li>
            </ol>
            <div class="tip">💡 If we change the order (for example, going to school before getting up!), it can't work. In programming, the order of instructions is called a <strong>sequence</strong>, and it's very important.</div>
            <p>Python is a <strong>programming language</strong> — a special way for us to give the computer precise instructions.</p>
          `}
        ],
        quiz:[
          {q:'Poukisa lòd (sekans) enpòtan nan yon pwogram?', q_en:'Why is order (sequence) important in a program?', opts:['Li pa enpòtan ditou','Si lòd la mal, pwogram nan ka pa mache byen','Sa fè òdinatè a limen pi vit','Sa chanje koulè ekran an'], opts_en:["It's not important at all",'If the order is wrong, the program might not work correctly','It makes the computer turn on faster','It changes the screen color'], correct:1, exp:'Menm jan ak yon resèt kizin, lòd la konte.', exp_en:'Just like a recipe, the order matters.'},

Croix-des-Bouquets : 15 mango

            <p>Ti Jan and Ti Jak count the mangoes that fell under mango trees in four places. We put the place names in one list, and the number of mangoes in another list:</p>
            <code class="block">places = ["Dorigol", "Tikazal", "Bon Repos", "Croix-des-Bouquets"]
mangoes = [12, 7, 20, 15]

total = 0
for i in range(4):
    print(places[i], ":", mangoes[i], "mangoes")
    total = total + mangoes[i]

print("Total:", total)</code>

            <code class="block">Dorigol : 12 mangoes
Tikazal : 7 mangoes
Bon Repos : 20 mangoes
Croix-des-Bouquets : 15 mangoes

function vt(h1, h2, rows){
  return '<table class="vocab-table"><tr><th>'+h1+'</th><th>'+h2+'</th></tr>'+
    rows.map(r=>'<tr><td>'+r[0]+'</td><td><strong>'+r[1]+'</strong></td></tr>').join('')+'</table>';
}
function dlg(lines, en){
  return lines.map(l=>'<div class="dialog-line"><span class="who" style="min-width:76px;margin-right:8px;">'+l[0]+'</span><span><strong>'+l[1]+'</strong>'+
    '<button class="say" type="button" data-say="'+l[1].replace(/"/g,'&quot;')+'">🔊</button><br><span class="ht">'+(en?'Kreyòl: ':'')+l[2]+'</span></span></div>').join('');
}

function t(key){
  const entry = UI[key];
  if(!entry) return '';
  return entry[lang] !== undefined ? entry[lang] : entry.ht;
}

/* Look up a bilingual field on a lesson/section/quiz object: L(obj,'title')
   returns obj.title_en when in English mode and present, else obj.title. */
function L(obj, field){
  if(lang === 'en'){
    const enVal = obj[field + '_en'];
    if(enVal !== undefined) return enVal;
  }
  return obj[field];
}

function fmtProgress(done,total){
  return lang==='en' ? (done+'/'+total+' lessons finished') : (done+'/'+total+' leson fini');
}
function fmtLessonCount(total){
  return lang==='en' ? (total+' lesson'+(total!==1?'s':'')) : (total+' leson');
}
function formatToday(){
  const d = new Date();
  if(lang==='en'){
    return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  }
  const months=['Janvye','Fevriye','Mas','Avril','Me','Jen','Jiyè','Out','Septanm','Oktòb','Novanm','Desanm'];
  return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}

  switch(active.id){
    case 'screen-name': renderNameScreen(); break;
    case 'screen-home': renderTrackCards(); updateOverallCertRow(); renderStats(); break;
    case 'screen-newprofile': renderAvatarPick(); break;
    case 'screen-pin': renderPinScreen(); break;
    case 'screen-roster': renderRoster(); break;
    case 'screen-similar': renderSimilar(); break;
    case 'screen-daily': if(dailyState()) goHome(); else openDaily(); break;
    case 'screen-board': openBoard(); break;
    case 'screen-progress': openProgressView(); break;
    case 'screen-track': renderTrackScreen(); break;
    case 'screen-lesson': renderLessonScreen(); break;
    case 'screen-cert': renderCertificate(window._certScope || 'all'); break;
  }
}

/* ---------------------------------------------------------
   STATE + PERSISTENCE
   Progress is saved per-name to localStorage on THIS device/
   browser only (there is no server — nothing leaves the device).
   If storage is unavailable, everything still works for the
   current session, it just won't be remembered after closing.
--------------------------------------------------------- */
const STORAGE_KEY = 'aprann-ak-nou-data-v1';

const state = {
  completed:{ konpite:new Set(), angle:new Set(), python:new Set() },
  currentTrack:null,
  currentLessonIdx:null,
  currentUser:null
};

let allUsersData = {}; // { name: { konpite:[idx,...], angle:[...], python:[...] } }

function loadAllUsersData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    allUsersData = raw ? JSON.parse(raw) : {};
  }catch(e){
    allUsersData = {};
  }
}

function persistAllUsersData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allUsersData));
  }catch(e){
    // storage unavailable (private browsing, etc.) — progress still works this session
  }
}

function saveCurrentUserProgress(){
  if(!state.currentUser) return;
  allUsersData[state.currentUser] = Object.assign({}, allUsersData[state.currentUser] || {}, {
    konpite: Array.from(state.completed.konpite),
    angle: Array.from(state.completed.angle),
    python: Array.from(state.completed.python)
  });
  persistAllUsersData();
}

let deviceId = 'unknown';
try{
  deviceId = localStorage.getItem(DEVICE_KEY) || '';
  if(!deviceId){ deviceId = 'd-'+makeId(); localStorage.setItem(DEVICE_KEY, deviceId); }
}catch(e){ deviceId = 'd-'+makeId(); }
let syncQueue = [];
try{ syncQueue = JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){ syncQueue = []; }
function saveQueue(){ try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(syncQueue.slice(-500))); }catch(e){} }
function queueEvent(type, extra){
  if(!state.currentUser) return;
  const ev = Object.assign({
    id: makeId(), ts: new Date().toISOString(), device: deviceId,
    student: state.currentUser, kid: (allUsersData[state.currentUser]||{}).id || '', event: type, lang: lang, app: APP_VERSION,
    konpite: state.completed.konpite.size, angle: state.completed.angle.size, python: state.completed.python.size,
    totalLessons: TRACKS.konpite.lessons.length + TRACKS.angle.lessons.length + TRACKS.python.lessons.length
  }, extra||{});
  syncQueue.push(ev); saveQueue(); flushQueue();
}
let flushing = false;
async function flushQueue(){
  if(flushing || !backendOn() || !syncQueue.length) return;
  if(typeof navigator!=='undefined' && navigator.onLine===false) return;
  flushing = true;
  const batch = syncQueue.slice(0,25);
  let sentOk = false;
  try{
    const res = await fetch(BACKEND_URL, {method:'POST', body: JSON.stringify({events: batch})});
    const data = await res.json();
    if(data && data.ok){
      const sent = new Set(batch.map(e=>e.id));
      syncQueue = syncQueue.filter(e=>!sent.has(e.id)); saveQueue();
      sentOk = true;
    }
  }catch(e){ /* offline or server busy: try again later */ }
  flushing = false;
  if(sentOk && syncQueue.length) setTimeout(flushQueue, 2000);
}
window.addEventListener('online', flushQueue);
setInterval(flushQueue, 60000);

/* --- v3: talk to the Google Sheet about WHO a kid is (permanent Kid ID) --- */
function canReach(){ return backendOn() && !(typeof navigator!=='undefined' && navigator.onLine===false); }
async function apiCall(url, opts, ms){
  if(!canReach()) return null;
  const ctl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  const tm = setTimeout(()=>{ if(ctl) ctl.abort(); }, ms||20000);
  try{
    const res = await fetch(url, Object.assign({}, opts||{}, ctl?{signal:ctl.signal}:{}));
    return await res.json();
  }catch(e){ return null; }
  finally{ clearTimeout(tm); }
}
function api(body, ms){ return apiCall(BACKEND_URL, {method:'POST', body: JSON.stringify(body)}, ms); }
function apiGet(query, ms){ return apiCall(BACKEND_URL + query, null, ms); }
// points earned on this phone that the sheet has not received yet, per week
function pendingFor(key){
  const m = {};
  syncQueue.forEach(e=>{ if(e.student===key && e.week && e.pts) m[e.week] = (m[e.week]||0) + (+e.pts||0); });
  return m;
}
function syncStatusText(){
  if(!backendOn()) return t('syncOff');
  return syncQueue.length ? t('syncPending').replace('{n}', syncQueue.length) : t('syncAllSent');
}

function isTrackComplete(trackKey){

function isAllComplete(){
  return isTrackComplete('konpite') && isTrackComplete('angle') && isTrackComplete('python');
}

/* ---------------------------------------------------------
   PROFILES (v2): first name + picture + 4-digit secret code.
   Several kids can share one phone. Profile key = "Name 🐓".
--------------------------------------------------------- */
// The trainer code itself is NOT written here any more (this page is public). Only its fingerprint is.
// To change the code: change TRAINER_CODE in Code.gs, run trainerHash() there, paste the result here.
const TRAINER_HASH = '042bb0288b6d14884a023b9c8c0224e36f8fb0750a29f86d9dcaf8bb3cce34fe';
function sha256(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = Array.from(new TextEncoder().encode(str));
  const bitLen = bytes.length*8;
  bytes.push(0x80); while(bytes.length%64!==56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push(i>=4 ? 0 : (bitLen>>>(i*8))&255);
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<bytes.length;o+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++) w[i]=((bytes[o+4*i]<<24)|(bytes[o+4*i+1]<<16)|(bytes[o+4*i+2]<<8)|bytes[o+4*i+3])>>>0;
    for(let i=16;i<64;i++){ const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3), s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0; }
    let [a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0;
      const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))>>>0;
      hh=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    h=[(h[0]+a)>>>0,(h[1]+b)>>>0,(h[2]+c)>>>0,(h[3]+d)>>>0,(h[4]+e)>>>0,(h[5]+f)>>>0,(h[6]+g)>>>0,(h[7]+hh)>>>0];
  }
  return h.map(x=>('0000000'+x.toString(16)).slice(-8)).join('');
}
function trainerOk(code){ return sha256('aprann-trainer|' + String(code||'').trim()) === TRAINER_HASH; }
const AVATARS = ['🐓','⚽','🌺','🥭','🦁','🐢','🚀','⭐','🎵','🏃','📚','🐟','🌳','🦋','🐐','🌞'];
const DAYS_GOAL = 3;              // days per week that keep a weekly streak going
const CLUB_GOAL = 200;            // lessons the whole club tries to finish each month

function pinHash(key, pin){
  let h = 2166136261 >>> 0; const str = 'aprann|' + key + '|' + pin;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(36);
}
function profileList(){ return Object.keys(allUsersData).sort((a,b)=>a.localeCompare(b)); }
function splitKey(key){

}
function escapeHtml(x){ return String(x).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function cleanName(v){
  v = (v||'').replace(/\s+/g,' ').trim();
  return v ? v.charAt(0).toUpperCase() + v.slice(1) : '';

async function newProfileNext(){
  if(np.busy) return;
  const err = document.getElementById('np-err'); err.className='pin-msg err';
  const name = np.legacyKey ? (allUsersData[np.legacyKey].name || np.legacyKey) : cleanName(document.getElementById('np-name').value);

  // v3: before making a new profile, ask the club list if this name already exists

    np.busy = true; err.className = 'pin-msg'; err.textContent = t('busy');

}

/* --- PIN pad --- */
// kind 'local'  = a profile saved on this phone (works offline)
// kind 'remote' = a kid picked from the club list; the code is checked by the Google Sheet
const pin = {};
function resetPin(o){
  Object.assign(pin, {kind:'local', mode:'enter', key:null, name:'', avatar:'', entry:'', first:'', legacyKey:null,
    msg:'', err:false, remote:null, mergeKey:null, tc:'', force:false, busy:false}, o||{});
}
resetPin();
function askPin(key){
  const d = allUsersData[key];
  if(!d || !d.pinHash){ startNewProfile(key); return; }   // old (v1) profile: add picture + code
  const sp = splitKey(key);
  resetPin({mode:'enter', key, name:sp.name, avatar:sp.avatar});
  renderPinScreen(); showScreen('screen-pin');
}
function askRemote(kid, mergeKey){
  resetPin({kind:'remote', mode: kid.hasPin ? 'enter' : 'create', remote:kid, mergeKey: mergeKey||null, name:kid.name, avatar:kid.avatar});
  renderPinScreen(); showScreen('screen-pin');
}
function renderPinScreen(){
  document.getElementById('pin-avatar').textContent = pin.avatar || '👤';
  document.getElementById('pin-name').textContent = pin.name;
  document.getElementById('pin-prompt').textContent =
    pin.mode==='create' ? t('pinCreate') : pin.mode==='confirm' ? t('pinConfirm') : t('pinEnter');
  document.getElementById('pin-forgot').style.display = pin.mode==='enter' ? '' : 'none';
  const dots = document.querySelectorAll('#pin-dots span');
  dots.forEach((d,i)=>d.className = i < pin.entry.length ? 'on' : '');
  const m = document.getElementById('pin-msg'); m.textContent = pin.msg; m.className = 'pin-msg' + (pin.err?' err':'');
  const pad = document.getElementById('pin-pad');
  if(!pad.childElementCount){
    ['1','2','3','4','5','6','7','8','9','⌫','0','✓'].forEach(k=>{
      const b = document.createElement('button'); b.textContent = k;
      b.onclick = ()=>pinKey(k); pad.appendChild(b);
    });
  }
}
function setPinBusy(on){ pin.busy = on; pin.msg = on ? t('busy') : ''; pin.err = false; renderPinScreen(); }
function pinKey(k){
  if(pin.busy) return;
  if(k==='⌫'){ pin.entry = pin.entry.slice(0,-1); renderPinScreen(); return; }
  if(k==='✓'){ if(pin.entry.length===4) pinSubmit(); return; }
  if(pin.entry.length < 4){ pin.entry += k; pin.msg=''; pin.err=false; }
  renderPinScreen();
  if(pin.entry.length===4) setTimeout(pinSubmit, 150);
}
async function pinSubmit(){
  if(pin.entry.length!==4 || pin.busy) return;
  const code = pin.entry;
  if(pin.mode==='create'){
    pin.first = code; pin.entry=''; pin.mode='confirm'; pin.msg=''; renderPinScreen(); return;
  }
  if(pin.mode==='confirm' && code !== pin.first){
    Object.assign(pin,{mode:'create', entry:'', first:'', msg:t('pinMismatch'), err:true}); renderPinScreen(); return;
  }
  if(pin.kind==='remote'){ await remoteSubmit(code); return; }
  if(pin.mode==='confirm'){
    // save profile on this phone (new, legacy upgrade, or reset)
    let data = allUsersData[pin.key];
    if(pin.legacyKey && pin.legacyKey !== pin.key){
      data = allUsersData[pin.legacyKey]; delete allUsersData[pin.legacyKey];
    }
    data = data || {konpite:[], angle:[], python:[]};
    data.name = pin.name; data.avatar = pin.avatar; data.pinHash = pinHash(pin.key, code);
    if(pin.tc && data.id) data.pendingReset = {pin:code, tc:pin.tc};   // tell the sheet about the new code when online
    allUsersData[pin.key] = data; persistAllUsersData();
    await afterLocalPin(pin.key, code); return;
  }
  // enter
  const d = allUsersData[pin.key];
  if(d && d.pinHash === pinHash(pin.key, code)){ await afterLocalPin(pin.key, code); return; }
  Object.assign(pin,{entry:'', msg:t('pinWrong'), err:true}); renderPinScreen();
}
function forgotPin(){
  const code = prompt(t('pinTrainerAsk'));
  if(code===null) return;
  if(!trainerOk(code)){ Object.assign(pin,{msg:t('pinTrainerBad'), err:true, entry:''}); renderPinScreen(); return; }
  Object.assign(pin,{mode:'create', entry:'', first:'', legacyKey:null, tc:code.trim(), msg:t('pinResetOk'), err:false});
  renderPinScreen();
}

/* --- v3: one permanent Kid ID per kid, kept in the Google Sheet --- */
const TRACK_KEYS = ['konpite','angle','python'];
// The right code was typed for a profile on this phone.
async function afterLocalPin(key, code){
  const d = allUsersData[key];
  if(d && d.id){ selectUser(key); syncFromServer(key, code); return; }   // already has its ID: go, and refresh quietly
  await linkProfile(key, code, pin.force, pin.legacyKey);                // first time online: get the ID
}
// Ask the sheet for this profile's permanent ID (or learn that the name looks like an existing kid).
async function linkProfile(key, code, force, legacyKey){
  const d = allUsersData[key];
  if(!d || !canReach()){ selectUser(key); return; }   // offline: works as before, links next time
  setPinBusy(true);
  await flushQueue();
  const r = await api({a:'register', name:d.name||key, avatar:d.avatar||'', pin:code, device:deviceId, key:key, key2:legacyKey||'', force:!!force});
  pin.busy = false;
  if(r && r.ok){ applyServer(key, r); selectUser(key); return; }
  if(r && r.similar && r.similar.length){ showSimilar({list:r.similar, key:key, code:code}); return; }
  selectUser(key);
}
// Quiet refresh after login: lessons done on another phone arrive here.
async function syncFromServer(key, code){
  const d = allUsersData[key];
  if(!d || !d.id || !canReach()) return;
  await flushQueue();
  if(d.pendingReset){
    const rr = await api({a:'resetpin', id:d.id, pin:d.pendingReset.pin, trainer:d.pendingReset.tc});
    if(rr && (rr.ok || rr.error==='trainer')){ delete d.pendingReset; persistAllUsersData(); }
  }
  const r = await api({a:'login', id:d.id, pin:code, device:deviceId, key:key});
  if(r && r.ok){ applyServer(key, r); if(state.currentUser===key) reloadCurrentUser(); }
}
// Put what the sheet knows (ID, lessons, points) into the profile on this phone.
function applyServer(key, r){
  const d = allUsersData[key]; if(!d || !r || !r.kid) return;
  d.id = r.kid.id; d.name = r.kid.name || d.name || key; d.avatar = r.kid.avatar || d.avatar || '';
  const p = r.progress || {};
  TRACK_KEYS.forEach(tk=>{
    const max = TRACKS[tk].lessons.length; const set = new Set(d[tk]||[]);
    (p[tk]||[]).forEach(i=>{ if(i>=0 && i<max) set.add(i); });
    d[tk] = Array.from(set).sort((a,b)=>a-b);
  });
  const pend = pendingFor(key); d.weeks = d.weeks || {};
  Object.keys(r.weeks||{}).forEach(wk=>{
    const sv = r.weeks[wk]; const loc = d.weeks[wk] || {pts:0, days:[]};
    const days = new Set([].concat(loc.days||[], sv.days||[]));
    d.weeks[wk] = {pts:(+sv.pts||0) + (pend[wk]||0), days:Array.from(days).sort()};   // the sheet's count is the true one
  });
  if(r.paid){   // which lessons this kid was really paid for (the sheet is the judge)
    d.paid = {}; Object.keys(r.paid).forEach(k=>{ d.paid[k] = {b: r.paid[k][0] ? 1 : 0, q: +r.paid[k][1] || 0}; });
    TRACK_KEYS.forEach(tk=>(d[tk]||[]).forEach(i=>{ const k = lessonKey(tk, i); if(!d.paid[k]) d.paid[k] = {b:0, q:0}; }));
    const td = ymd(new Date()); d.baseDays = d.baseDays || {};
    if(r.baseDays && r.baseDays[td] !== undefined) d.baseDays[td] = Math.max(d.baseDays[td]||0, +r.baseDays[td]||0);
  }
  if(r.daily){   // daily challenges done on other phones
    d.dailyCount = Math.max(d.dailyCount||0, +r.daily.count||0);
    d.dailyPerfect = Math.max(d.dailyPerfect||0, +r.daily.perfect||0);
    const today = ymd(new Date());
    if(r.daily.days && r.daily.days[today]!==undefined && !(d.daily && d.daily.date===today)) d.daily = {date:today, score:+r.daily.days[today]||0, total:5};
  }
  persistAllUsersData();
}
function reloadCurrentUser(){
  const d = allUsersData[state.currentUser]; if(!d) return;
  TRACK_KEYS.forEach(tk=>{ (d[tk]||[]).forEach(i=>state.completed[tk].add(i)); });
  saveCurrentUserProgress(); updateUserBadge(); checkBadges(false);
  const active = document.querySelector('.screen.active');
  if(active && active.id==='screen-home'){ renderTrackCards(); updateOverallCertRow(); renderStats(); }
  else if(active && active.id==='screen-track'){ renderTrackScreen(); }
}
// A kid picked from the club list typed a code: the sheet checks it.
async function remoteSubmit(code){
  const kid = pin.remote;
  const wasMode = pin.mode==='confirm' ? 'create' : pin.mode;
  const back = (msg, mode)=>{ pin.busy = false; Object.assign(pin,{entry:'', first:'', mode:mode, msg:msg, err:true}); renderPinScreen(); };
  if(!canReach()){ back(t('needNet'), wasMode); return; }
  setPinBusy(true);
  if(pin.tc){   // trainer reset of a forgotten code
    const rr = await api({a:'resetpin', id:kid.id, pin:code, trainer:pin.tc});
    pin.tc = '';
    if(!rr || !rr.ok){ back(rr ? t('pinTrainerBad') : t('needNet'), 'enter'); return; }
  }
  const r = await api({a:'login', id:kid.id, pin:code, device:deviceId, key:pin.mergeKey||''});
  if(r && r.ok){ pin.busy = false; selectUser(adoptRemote(r, code, pin.mergeKey)); return; }
  if(r && r.error==='pin'){ kid.hasPin = true; back(t('pinWrong'), 'enter'); return; }
  back(t('needNet'), wasMode);
}
// Make (or reuse) the profile on this phone for a kid the sheet just confirmed.
function adoptRemote(r, code, mergeKey){
  let key = (mergeKey && allUsersData[mergeKey]) ? mergeKey : null;
  if(!key) key = profileList().find(k=>allUsersData[k].id === r.kid.id) || null;
  if(!key){
    key = (r.kid.name + ' ' + (r.kid.avatar||'')).trim();
    if(allUsersData[key]) key = key + ' #' + r.kid.id;
    allUsersData[key] = {konpite:[], angle:[], python:[]};
  }
  allUsersData[key].pinHash = pinHash(key, code);
  applyServer(key, r);
  return key;
}

/* --- v3: "I already have a profile" — the club list --- */

let roster = null, rosterMsg = '';
try{ roster = JSON.parse(localStorage.getItem(ROSTER_KEY)||'null'); }catch(e){ roster = null; }
function plainName(x){ return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }

/* ---------------------------------------------------------
   POINTS, DAYS ACTIVE, WEEKLY STREAK (stored per profile)
--------------------------------------------------------- */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekKeyOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return ymd(x); }
function thisWeek(){ return weekKeyOf(new Date()); }
function prevWeekKey(wk, n){ const [y,m,dd] = wk.split('-').map(Number); const x = new Date(y, m-1, dd); x.setDate(x.getDate()-7*(n||1)); return ymd(x); }
function userData(){ return allUsersData[state.currentUser] || {}; }
function weekInfo(d, wk){
  d.weeks = d.weeks || {};
  return d.weeks[wk] = d.weeks[wk] || {pts:0, days:[]};
}
function awardPoints(lessonPts){
  const d = userData(); const wk = thisWeek(); const w = weekInfo(d, wk);
  const today = ymd(new Date());
  let bonus = 0;
  if(!w.days.includes(today)){ w.days.push(today); bonus = 2; }
  const earned = lessonPts + bonus;
  w.pts += earned;
  return earned;
}
function weeklyStreak(d){
  // consecutive weeks with >= DAYS_GOAL active days; one "saver" per calendar month covers a missed week
  const weeks = d.weeks || {};
  const cur = thisWeek();
  let streak = 0, wk = cur;
  const usedSaverMonths = new Set();
  // the current week counts only once it reaches the goal (it can't break the streak before it ends)
  if((weeks[cur]?.days?.length||0) >= DAYS_GOAL) streak++;
  wk = prevWeekKey(cur);
  for(let i=0;i<104;i++){
    const n = weeks[wk]?.days?.length || 0;
    if(n >= DAYS_GOAL){ streak++; }
    else {
      const month = wk.slice(0,7);
      const hadActivityBefore = Object.keys(weeks).some(k=>k < wk && (weeks[k].days||[]).length);
      if(!usedSaverMonths.has(month) && hadActivityBefore && streak>0){ usedSaverMonths.add(month); }
      else break;
    }
    wk = prevWeekKey(wk);
  }
  const saverUsedThisMonth = usedSaverMonths.has(cur.slice(0,7));
  return {streak, saverUsedThisMonth};
}
function renderStats(){
  const card = document.getElementById('stats-card');
  if(!state.currentUser){ card.style.display='none'; renderDailyCard(); renderLevelCard(); return; }
  card.style.display='flex';
  const d = userData(); const w = (d.weeks||{})[thisWeek()] || {pts:0, days:[]};
  const {streak, saverUsedThisMonth} = weeklyStreak(d);
  const labels = lang==='en' ? ['M','T','W','T','F','S','S'] : ['L','M','M','J','V','S','D'];
  const [y,m,dd] = thisWeek().split('-').map(Number);
  const today = ymd(new Date());
  let dots = '';
  for(let i=0;i<7;i++){ const x = new Date(y,m-1,dd+i); const k = ymd(x);
    dots += '<span class="'+(w.days.includes(k)?'on':'')+(k===today?' today':'')+'">'+labels[i]+'</span>'; }
  card.innerHTML =
    '<div class="stat"><div class="big">⭐ '+w.pts+'</div><div class="lbl">'+t('statWeekPts')+'</div></div>'+
    '<div class="stat"><div class="big">'+w.days.length+'/7</div><div class="lbl">'+t('statDays')+' · '+t('statGoal').replace('{n}',DAYS_GOAL)+'</div><div class="day-dots">'+dots+'</div></div>'+
    '<div class="stat"><div class="big">🔥 '+streak+'</div><div class="lbl">'+t('statStreak')+'</div><div class="lbl">'+(saverUsedThisMonth?t('statSaverUsed'):t('statSaver'))+'</div></div>';
  renderDailyCard(); renderLevelCard();
}

const DAILY_N = 5;
function dailyState(){ const d = userData(); const today = ymd(new Date()); return (d.daily && d.daily.date===today) ? d.daily : null; }
function dailyPool(){
  const pool = [];
  TRACK_KEYS.forEach(tk=>{ Array.from(state.completed[tk]).sort((a,b)=>a-b).forEach(i=>{
    const les = TRACKS[tk].lessons[i]; ((les && les.quiz) || []).forEach(q=>pool.push(q)); }); });
  return pool;
}
function seededRandom(str){
  let h = 2166136261 >>> 0; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return ()=>{ h += 0x6D2B79F5; let x = h; x = Math.imul(x ^ (x>>>15), x | 1); x ^= x + Math.imul(x ^ (x>>>7), x | 61); return ((x ^ (x>>>14))>>>0) / 4294967296; };
}
function dailyPick(){
  const pool = dailyPool(); const d = userData();
  const rnd = seededRandom(ymd(new Date()) + '|' + (d.id || state.currentUser));   // same questions all day, new ones tomorrow
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool.slice(0, DAILY_N);
}

  h += '<p class="rules" style="margin:10px 0 0;">'+t('fairToday').replace('{a}', Math.min(DAILY_NEW, baseToday(userData()))).replace('{b}', DAILY_NEW)+'</p>';
  card.innerHTML = h;
}

/* ---------------------------------------------------------
   VOICE: read English words aloud with the phone's own voice (free, often offline)
--------------------------------------------------------- */
function canSpeak(){ return typeof window!=='undefined' && 'speechSynthesis' in window; }
let enVoice = null;
function pickVoice(){
  if(!canSpeak()) return;
  const vs = speechSynthesis.getVoices();
  enVoice = vs.find(v=>/^en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if(canSpeak()){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } else { document.documentElement.classList.add('no-speech'); }
function say(text){
  if(!canSpeak()) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.8; if(enVoice) u.voice = enVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}
function sayBtn(text){
  return canSpeak() ? '<button class="say" type="button" title="'+t('sayTitle')+'" data-say="'+escapeHtml(text)+'">🔊</button>' : '';
}
document.addEventListener('click', e=>{
  const b = e.target.closest && e.target.closest('.say');
  if(b){ e.preventDefault(); say(b.getAttribute('data-say')); }
});
function addSpeakerButtons(container){
  if(!canSpeak()) return;
  // English words in the English course vocabulary tables
  container.querySelectorAll('.vocab-table td strong').forEach(st=>{
    if(st.querySelector('.say')) return;
    const txt = st.textContent.replace(/\(.*?\)/g,'').replace(/\.\.\./g,'').trim();
    if(txt) st.insertAdjacentHTML('beforeend', sayBtn(txt));
  });
}

/* ---------------------------------------------------------
   WISLY'S KREYÒL VOICE INTROS (audio/<code>.mp3, ~120 KB each).
   Downloaded only when a kid taps play, then kept for offline use.
   Messages m1–m4 play on the welcome screen, after a lesson, after a wrong answer, and when a course is done.
--------------------------------------------------------- */
const VOICE_FILES = {
  konpite: ['k1','k2','k3','k4','k5','k6','k7'],
  angle:   ['a1','a2','a3','a4','a5','a6','a7','a8'],
  python:  ['p1','p2','p3','p4','p5','p6','p7','p8']
};
function lessonVoice(trackKey, idx){ const v = (VOICE_FILES[trackKey]||[])[idx]; return v ? 'audio/'+v+'.mp3' : null; }
let voiceAudio = null, voiceBtnEl = null;
const SOUND_KEY = 'aprann-ak-nou-sound-v1';
let soundOn = true;
try{ soundOn = localStorage.getItem(SOUND_KEY) !== 'off'; }catch(e){}
function renderSoundBtn(){ const b = document.getElementById('sound-toggle-btn'); if(b) b.textContent = soundOn ? t('soundOn') : t('soundOff'); }
function toggleSound(){
  soundOn = !soundOn; try{ localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); }catch(e){}
  if(!soundOn){ stopVoice(); stopMsg(); }
  renderSoundBtn();
}
function stopVoice(){
  if(voiceAudio){ voiceAudio.pause(); voiceAudio = null; }
  if(voiceBtnEl){ voiceBtnEl.textContent = t(voiceBtnEl.dataset.label || 'voiceBtn'); voiceBtnEl.classList.remove('playing'); voiceBtnEl = null; }
}
// short encouragement messages (m2 good job, m3 try again, m4 course done): play only if sound is on;
// silently skipped if the clip isn't downloaded yet and there's no internet
let msgAudio = null;
function stopMsg(){ if(msgAudio){ msgAudio.pause(); msgAudio = null; } }
async function playMsg(code){
  if(!soundOn) return;
  try{
    const res = await fetch('audio/'+code+'.mp3'); if(!res.ok) return;
    const url = URL.createObjectURL(await res.blob());
    stopMsg(); stopVoice();
    msgAudio = new Audio(url); msgAudio.onended = ()=>URL.revokeObjectURL(url);
    await msgAudio.play();
  }catch(e){}
}
// download the 3 short messages in the background so they also work offline later (~210 KB)
function prefetchMsgs(){ if(navigator.onLine===false) return; ['m2','m3','m4'].forEach(c=>fetch('audio/'+c+'.mp3').catch(()=>{})); }
async function toggleVoice(btn, labelKey){
  if(labelKey) btn.dataset.label = labelKey;
  if(voiceBtnEl === btn){ stopVoice(); return; }
  stopVoice(); stopMsg();
  voiceBtnEl = btn; btn.textContent = t('voiceLoading');
  try{
    let res;
    try{ res = await fetch(btn.getAttribute('data-voice')); }   // the service worker keeps a copy for offline
    catch(e){ throw new Error('offline'); }
    if(!res.ok) throw new Error('offline');
    const url = URL.createObjectURL(await res.blob());
    if(voiceBtnEl !== btn) return;
    voiceAudio = new Audio(url);
    voiceAudio.onended = ()=>{ URL.revokeObjectURL(url); stopVoice(); };
    await voiceAudio.play();
    btn.textContent = t('voiceStop'); btn.classList.add('playing');
  }catch(e){
    if(voiceBtnEl === btn){ btn.textContent = e.message==='offline' ? t('voiceOffline') : t('voiceCantPlay'); voiceBtnEl = null; setTimeout(()=>{ btn.textContent = t(btn.dataset.label || 'voiceBtn'); }, 3000); }
  }
}

/* ---------------------------------------------------------
   QUIZ RENDERING
--------------------------------------------------------- */
// v3.1: answers appear in a different order each time, so kids read them instead of remembering a position.
// An answer like "Both" / "Tou de" must stay last, so those questions keep their order.
function answerOrder(q, opts){
  const order = opts.map((o,i)=>i);
  const keep = /\b(both|all of|none of|above)\b|tou ?de|toulède|tout sa|anwo|okenn nan/i;
  if(q.noShuffle || (q.opts||[]).concat(q.opts_en||[]).some(o=>keep.test(String(o)))) return order;
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  return order;
}
function renderQuiz(quiz){
  const area = document.getElementById('quiz-area');
  area.innerHTML='';
  const answered = new Array(quiz.length).fill(false);
  window._quizCorrect = 0; window._quizTotal = quiz.length; window._triedAgainMsg = false;

  quiz.forEach((q,qi)=>{
    const block = document.createElement('div');
    block.className='q-block';
    const qText = L(q,'q');
    const qTextHtml = qText.split('\n').map(l=>l).join('<br>');
    block.innerHTML = `<p class="q-text">${qi+1}. ${qTextHtml}</p><div class="q-options"></div><p class="q-feedback"></p>`;
    const optsWrap = block.querySelector('.q-options');
    const opts = (lang==='en' && q.opts_en) ? q.opts_en : q.opts;
    answerOrder(q, opts).forEach(oi=>{
      const opt = opts[oi];
      const optBtn = document.createElement('button');
      optBtn.className='q-opt';
      optBtn.dataset.oi = oi;
      optBtn.textContent = opt;
      optBtn.onclick = ()=>{
        if(answered[qi]) return;
        answered[qi]=true;
        const allOpts = optsWrap.querySelectorAll('.q-opt');
        allOpts.forEach(o=>o.disabled=true);
        if(oi===q.correct){
          window._quizCorrect++;
          optBtn.classList.add('correct');
        } else {
          optBtn.classList.add('wrong');
          optsWrap.querySelector('.q-opt[data-oi="'+q.correct+'"]').classList.add('correct');
          if(!window._triedAgainMsg){ window._triedAgainMsg = true; playMsg('m3'); }
        }
        block.querySelector('.q-feedback').textContent = L(q,'exp') || '';
        checkAllAnswered(answered);
      };
      optsWrap.appendChild(optBtn);
    });
    area.appendChild(block);
  });

  window._currentAnswered = answered;
}

function checkAllAnswered(answered){
  const allDone = answered.every(a=>a);
  const btn = document.getElementById('finish-btn');
  if(btn) btn.disabled = !allDone;
}
